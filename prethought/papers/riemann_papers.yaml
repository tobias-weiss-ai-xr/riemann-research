- id: P-cm_paper-2026
  name: "Data-Driven Detection of Complex Multiplication in Weight 2 Cusp Forms"
  type: paper
  category: machine-learning
  subcategory: modular-forms
  author: "Tobias Faller"
  date: "June 2026"
  status: "arXiv submission"
  abstract: |
    We introduce a machine learning approach for detecting Complex Multiplication (CM) in weight 2
    newforms using a dataset of 53,779 modular forms from the LMFDB. By combining prime-indexed
    Fourier coefficients a_p for 25 primes up to 97 with 11 Sato-Tate moments M_2(d) and
    standardized ratios, we achieve F1=0.900 and precision=0.973 on an 80/20 held-out test set
    using Gradient Boosting Machines (GBM).
  keywords:
    - Complex Multiplication
    - Modular Forms
    - LMFDB
    - Machine Learning
    - Fourier Coefficients
    - Sato-Tate
    - Gradient Boosting
  file: "papers/cm_paper.md"
  source: "riemann-repo"
  tags:
    - cm-detection
    - ml
    - modular-forms
    - lmfdb

