- category: theorems
  cypher_type:
  - von_koch
  - Theorem
  description: RH equivalent to the classical prime counting error bound. The tightest
    possible bound from RH.
  domain: analytic number theory
  id: CE-von-Koch-Error-Term
  name: von Koch Error Term
  proof_status: proven
  significance: major
  statement: π(x) = Li(x) + O(x^{1/2} log x)
