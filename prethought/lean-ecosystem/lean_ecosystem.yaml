# ============================================================
# MATHLIB4 — KEY RH-RELEVANT FILES
# ============================================================

- id: MATHLIB-riemannZeta
  name: "riemannZeta in mathlib4 (David Loeffler)"
  type: concept
  category: mathlib
  subcategory: number-theory
  date: "2026-01-01"
  year: 2026
  status: formalized
  confidence: 1.0
  description: |
    Mathlib/NumberTheory/LSeries/RiemannZeta.lean (David Loeffler, 2023):
    - riemannZeta : ℂ → ℂ (the Riemann zeta function)
    - completedRiemannZeta : Λ(s) = π^(-s/2) Γ(s/2) ζ(s) (away from poles)
    - completedRiemannZeta₀ : entire function Λ₀(s) = Λ(s) + 1/(s-1) - 1/s
    - differentiable_completedZeta₀ : Λ₀ is entire
    - riemannZeta_one_sub : functional equation relating ζ(s) and ζ(1-s)
    - zeta_eq_tsum_one_div_nat_add_one_cpow : ζ(s) = ∑' 1/(n+1)^s for Re s > 1
    KEY for RH project: the functional equation s ↔ 1-s is FORMALIZED.
  key_theorems:
    - "riemannZeta_one_sub : functional equation"
    - "differentiable_completedZeta₀ : entireness of completed zeta"
    - "zeta_eq_tsum_one_div_nat_add_one_cpow : Dirichlet series representation"
  file: "Mathlib/NumberTheory/LSeries/RiemannZeta.lean"
  references:
    - OP-Hadamard-Product-Gap
  tags: ["riemann-zeta", "functional-equation", "mathlib", "formalized"]

- id: MATHLIB-zetaZeros
  name: "ZetaZeros — Discreteness of zeta zeros (Huanyu Zheng)"
  type: concept
  category: mathlib
  subcategory: number-theory
  date: "2026-01-01"
  year: 2026
  status: formalized
  confidence: 1.0
  description: |
    Mathlib/NumberTheory/LSeries/ZetaZeros.lean (Huanyu Zheng, 2026):
    - riemannZetaZeros : Set ℂ (the zeros of the Riemann zeta function)
    - isClosed_riemannZetaZeros : the zeros are closed
    - isDiscrete_riemannZetaZeros : the zeros are discrete
    - any compact set intersects finitely many zeros
    Foundation for any zero-based approach to RH.
  file: "Mathlib/NumberTheory/LSeries/ZetaZeros.lean"
  tags: ["zeta-zeros", "discreteness", "mathlib", "formalized"]

