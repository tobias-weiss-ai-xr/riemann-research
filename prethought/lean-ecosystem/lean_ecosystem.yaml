- id: CSLIB-overview
  name: "CSLib — Computer Science library for Lean 4"
  type: documentation
  category: cslib
  subcategory: overview
  date: "2026-01-01"
  year: 2026
  status: active
  confidence: 1.0
  description: |
    CSLib is the formalized computer science library for Lean 4, a sibling
    project to mathlib. Folders: Algorithms (sorting, etc.), Computability
    (52 files: Turing machines, automata, reductions), Crypto (ten files),
    Foundations (56 files: sets, orders, relations), Languages (43 files:
    regular languages, context-free grammars, type systems), Logics (16 files),
    MachineLearning, Probability. Example instantiation of the "do one thing
    well + compose" Unix-style philosophy for formal libraries.
  url: "https://github.com/tobias-weiss-ai-xr/cslib"
  tags: ["cslib", "computer-science", "lean", "formalization"]

