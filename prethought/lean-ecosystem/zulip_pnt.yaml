- id: ZE-Hadamard-Factorization-DONE
  name: "Hadamard factorization theorem — NOW FORMALIZED (Cipollina)"
  type: finding
  category: upstream
  subcategory: hadamard
  date: "2026-01-16"
  year: 2026
  status: confirmed
  confidence: 0.98
  description: |
    CRITICAL UPDATE for the Riemann project: the Hadamard factorization theorem
    — previously a MAJOR GAP in mathlib (OP-Hadamard-Product-Gap) — has been
    COMPLETELY FORMALIZED by Matteo Cipollina (Jan 16 2026) and applied to
    riemannZeta.

    What was built:
    - Refactored Hadamard factorization theorem (removed non-mathlib-idiomatic
      ZeroData structure; now takes intrinsic hypotheses on entire f, e.g.
      EntireOfFiniteOrder ρ f)
    - Applied to riemannZeta (corollaries to be upstreamed in a later PR cycle
      due to Gamma function + Stirling prerequisites)
    - Uses canonical product API: WeierstrassFactor, CanonicalProduct, Divisor,
      LogSingularity, CartanBound, ExpPoly
    - Follows Terence Tao's proof outline
    - PR'd to PNT+ fork, ready to be upstreamed (with @Alex Kontorovich and
      @Terence Tao support)
    - Also uses 2 files from the Carleson project (Annuli API) planned for mathlib

    STATUS: The Riemann project's "Hadamard product gap in mathlib" is being
    closed upstream. It is NOT in mathlib main yet, but it is formalized and
    PR-ready.
  key_files:
    - "Mathlib/Analysis/Complex/WeierstrassFactor"
    - "Mathlib/Analysis/Complex/CanonicalProduct"
    - "Mathlib/Analysis/Complex/Divisor"
    - "Mathlib/Analysis/Complex/LogSingularity"
    - "Mathlib/Analysis/Complex/CartanBound"
    - "Mathlib/Analysis/Complex/ExpPoly"
