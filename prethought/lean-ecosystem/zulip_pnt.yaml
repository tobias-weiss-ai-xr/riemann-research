  type: strategy
  category: upstream
  subcategory: strategy
  date: "2026-01-01"
  year: 2026
  status: proposed
  confidence: 0.8
  description: |
    The Riemann project has been planning to contribute Hadamard product,
    nuclear operator theory, and Fredholm determinant to mathlib (EPIC-7).
    The Zulip research shows:
    1. HADAMARD PRODUCT — already being upstreamed by Cipollina/PNT+; the
       Riemann project should TRACK the PR and re-use it, not re-implement.
    2. RIEMANN ZETA + zeros — already in mathlib (Loeffler 2023, Huanyu Zheng 2026);
       the Riemann project's FriedliRatio.lean should import these instead of
       re-developing zeta.
    3. L-SERIES / PrimesInAP — mathlib has Dirichlet L-functions; relevant for
       any Pizer/Hecke pathway.
    NEW STRATEGY (stoic unix): Coordinate with PNT+ instead of duplicating.
    Next concrete step: check whether riemannZeta/functional equation
    (riemannZeta_one_sub) can replace the hand-rolled spectral-zeta manipulations
    in FriedliRatio.lean.
  references:
