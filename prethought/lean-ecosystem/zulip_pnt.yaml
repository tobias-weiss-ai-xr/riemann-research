- id: ZE-Wiener-Ikehara
  name: "Wiener-Ikehara tauberian theorem (PNT+)"
  type: finding
  category: upstream
  subcategory: pnt
  date: "2025-03-02"
  year: 2025
  status: confirmed
  confidence: 0.95
  description: |
    Wiener-Ikehara tauberian theorem is at the analytic core of the PNT+
    formalization. Discussion (Helfgott, Kontorovich, Tao, Loeffler, Commelin,
    Beffara) on sources:
    - The 'first_fourier' lemma (n ↦ f(n)/n^σ summable for all σ>1 + ψ continuous
      & integrable ⇒ ...) was re-derived by Helfgott independently — elegant
      because formalization removes superfluous assumptions (e.g. compact support)
    - Tao wrote the blueprint from his own analytic number theory course notes
      (Proposition 7 of his notes), plus Fourier-analytic rewriting of PNT proofs
    - Kontorovich: complex-analytic part follows his own course notes
    - Key insight: formalization forces minimal hypotheses into the open
      (a "fail fast" virtue aligned with the Riemann project's stoic philosophy)
  tags: ["wiener-ikehara", "tauberian", "fourier", "upstream", "pnT"]

- id: ZE-Explicit-Estimates
  name: "Explicit estimates program (Helfgott et al.)"
  type: finding
  category: upstream
  subcategory: explicit-constants
  date: "2026-01-09"
  year: 2026
  status: active
  confidence: 0.9
  description: |
    The PNT+ explicit-estimates effort (Helfgott, Kontorovich, Monticone, Tao)
    targets PNT with explicit error terms and sharp constants. Key data points:
    - Helfgott: a target 'good constant' is |ψ(x) - x| ≤ √(log x) exp(-√(log x / C))
      with C ≈ 17.51 (Theorem 11, Rosser-Schoenfeld 1961); Fiori-Kadiri-Swidinsky
      hold the record (2022)
    - Two complementary bound types: M(x)=o(x) type (Mertens) recursive process
      starting from explicit PNT + Mertens bound (Chebyshev-Mertens steampunk method),
      and the analytic explicit PNT route
    - Ongoing tasks documented in big 'Explicit estimates, outstanding tasks v2'
      topic: LCM bounds, short primes subintervals, Chebyshev bounds miniproject,
      Erdos problem 392 (factoring n! into factors ≤ n²), Costa Pereira inequality,
      Selberg/Rosser-Schoenfeld identities, log tables, Riemann-Stieltjes theory,
      odd Goldbach for small n
  subprojects:
    - "Bounds on LCM(1..n) in Mathlib"
    - "New miniproject: Chebyshev bounds"
    - "New miniproject: Primes in short intervals"
    - "New subproject: Odd Goldbach for small n"
    - "Erdos problem 392 (factoring n!)"
    - "Costa Pereira inequality"
    - "Some Rosser-Schoenfeld identities"
    - "Strong PNT"
    - "Prime number theorem in AP"
  references:
    - ZE-PNT-Project
  tags: ["explicit-estimates", "constants", "roserschoenfeld", "upstream"]

- id: ZE-Explicit-PNT-relevance
