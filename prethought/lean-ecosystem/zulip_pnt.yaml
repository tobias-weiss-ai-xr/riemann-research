  year: 2026
  status: active
  confidence: 0.9
  description: |
    A large collaborative project formalizing the Prime Number Theorem (and
    its strengthenings) in Lean 4. Led by Alex Kontorovich and Terence Tao,
    with Harald Helfgott, Pietro Monticone, Matteo Cipollina, David Loeffler,
    Johan Commelin, Vincent Beffara. Maintained in the mathlib repo
    (Mathlib/NumberTheory) + a blueprint.

    KEY RELEVANCE to the Riemann project: PNT+ has ALREADY formalized parts of
    analytic number theory that the Riemann project needs, notably:
    1. Wiener-Ikehara tauberian theorem (basis of analytic PNT)
    2. Strong PNT (PNT#865, PNT#866 by Pietro Monticone, Feb 2026)
    3. Hadamard factorization theorem (Matteo Cipollina, Jan 2026) — PR to mathlib
    4. Explicit estimates program with sharp constants (Helfgott)
    5. Euler-Maclaurin, Poisson summation infrastructure
    6. Fejér's theorem formalized
    7. Borel-Carathéodory (so PNT+ no longer strictly needs Hadamard, but has it)

    This means the Riemann project's "Hadamard product gap in mathlib" is
    being closed upstream by a dedicated team. Strategy shift: MIRROR/UPTAKE
    PNT+ work rather than re-implement.
