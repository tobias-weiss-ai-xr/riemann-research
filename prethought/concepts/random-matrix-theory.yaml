- id: RM-ZetaMoments
  name: "RMT Model for Zeta Moments"
  type: concept
  category: number-theory
  subcategory: zero-statistics
  definition: |
    Random matrix theory supplies the conjectural model for moments of the
    Riemann zeta function: the moments of |ζ(1/2 + it)| mirror moments of
    characteristic polynomials of large random unitary matrices. In the KG
    this is carried by the researcher node for Jon Keating (Oxford; research
    areas: random matrix theory, number theory, quantum chaos).
  properties:
    - model_object: "characteristic polynomials of CUE/unitary matrices"
    - kg_carrier: "Researcher Jon Keating — random matrix theory, number theory,
      quantum chaos (06-papers-approaches.cypher)"
    - dual_role: "RMT for zeta moments AND RMT for deep-learning loss
      landscapes (cross-pollination per KG)"
  importance: |
    Moments are the smoothest observable of ζ on the critical line; their
    RMT conjectures are among the most tested unproven statements in
    analytic number theory and anchor the statistical view of RH.
  relationships:
    - same_researcher_as: "RM-RMTDL (Keating)"
    - statistics_complement: "RM-GUE (spacings vs. magnitudes of ζ)"
  references:
    - type: cypher
      file: "../../kg/cypher/06-papers-approaches.cypher"
  tags: ["zeta-moments", "rmt", "keating", "quantum-chaos", "characteristic-polynomials"]

- id: RM-HilbertPolya
  name: "Hilbert-Pólya Bridge"
  type: conjecture
  category: equivalences
  subcategory: hilbert-polya
  statement: |
    The imaginary parts of the non-trivial zeros of ζ(s) are the eigenvalues
    of a self-adjoint operator on a Hilbert space.
  importance: |
    If true, RH follows immediately: self-adjoint operators have real
    eigenvalues → Im(ρ) real → Re(ρ) = 1/2. The GUE statistics of the
    zeros (RM-GUE) are precisely what one expects from such an operator
    drawn at random. Yakaboylu (2023) constructed a Hamiltonian with real
    eigenvalues under certain conditions.
  critical_caveat: |
    KG note (07-rh-equivalences.cypher): NOT proven equivalent to RH — it
    is a SUFFICIENT condition only (hilbert_polya -[:IMPLIES]-> rh);
    the converse is unknown. Do not bookkeep it as an equivalence.
  relationships:
    - implies: "RH (one-way, KG relation IMPLIES)"
    - statistical_evidence: "RM-GUE (GUE spacing law)"
    - attempted_constructions: "Yakaboylu Hamiltonian construction (KG theorem node)"
    - rh_equivalence_bookkeeping: "rh-equivalence-class.yaml (listed there as one-way)"
  references:
    - type: cypher
      file: "../../kg/cypher/07-rh-equivalences.cypher"
  tags: ["hilbert-polya", "self-adjoint", "spectral-interpretation", "yakaboylu", "one-way-implies"]
