# Random Matrix Theory & Zero Statistics — Core Concepts
# Extracted from kg/cypher/09-graphs-extended.cypher (Zeta Zero Spacing
# Graph), 06-papers-approaches.cypher (RMT + Deep Learning approach, Keating),
# 07-rh-equivalences.cypher (Hilbert-Pólya, Yakaboylu) and
# 08-papers-extended.cypher (Odlyzko-te Riele, Shanker 2024).
# The graph-side entry for zero spacings lives in arithmetic-graphs.yaml
# (AG-ZeroSpacingGraph); this file covers the statistical and spectral
# viewpoint: GUE statistics, the RMT+DL approach, and the Hilbert-Pólya bridge.
# Related: arithmetic-graphs.yaml (AG-ZeroSpacingGraph), ai-approaches.yaml,
#          rh-equivalence-class.yaml, computational-resources.yaml

- id: RM-GUE
  name: "GUE Statistics of Zeta Zero Spacings"
  type: concept
  category: number-theory
  subcategory: zero-statistics
  definition: |
    The normalized spacings between consecutive non-trivial zeros γ_n of
    ζ(s) follow the eigenvalue spacing statistics of the Gaussian Unitary
    Ensemble (GUE) of random matrix theory (Montgomery-Odlyzko law;
    Tracy-Widom edge behavior in the tails). Per the KG, the Zeta Zero
    Spacing Graph (vertices γ_n, edges between consecutive zeros) encodes
    exactly these GUE statistics.
  properties:
    - spacing_law: "GUE / Tracy-Widom (KG: zero_spacing_graph properties)"
    - data_source: "Odlyzko's zero computations; Platt's 10¹³ zeros (see computational-resources.yaml)"
    - graph_view: "AG-ZeroSpacingGraph — time_series_graph, feasibility ★★"
  importance: |
    The single strongest structural hint for Hilbert-Pólya: zeros behave
    like eigenvalues of a large random Hermitian matrix, i.e. like the
    spectrum of a self-adjoint operator.
  caveat: |
    KG research-gap note: this is a time-series / point-process question,
    NOT a graph question — GNNs add no value over classical time-series
    methods here (wrong-tool warning recorded in the KG).
  relationships:
    - motivates: "RM-HilbertPolya (spectral interpretation of the statistics)"
    - data_infrastructure: "CD-PlattZeros, CD-OdlyzkoZeros (computational-resources.yaml)"
    - graph_encoding: "AG-ZeroSpacingGraph (arithmetic-graphs.yaml)"
  references:
    - type: cypher
      file: "../../kg/cypher/09-graphs-extended.cypher"
  tags: ["gue", "tracy-widom", "zero-spacings", "rmt", "point-process", "montgomery-odlyzko"]

