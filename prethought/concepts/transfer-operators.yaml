# Transfer Operators — Core Concept
# Related: dynam-systems, selberg-zeta, mayer-1991

- id: TO-Mayer1991
  name: "Mayer's Transfer Operator"
  type: concept
  category: dynam-systems
  subcategory: transfer-operator
  definition: |
    L_s : B(V) → B(V) (bounded operators on the Banach space of bounded functions)
    L_s f(x) = Σ_{n=1}^∞ (n+x)^{-2s} f(1/(n+x))
    where x ∈ (0,∞), s ∈ ℂ, and V is a suitable Banach space.
    This is a weighted Perron-Frobenius-type operator.
  weight: "(n+x)^{-2s}"
  base_map: "x ↦ 1/(n+x)"
  properties:
    - "For Re(s) > 1, L_s is nuclear (trace-class) on suitable spaces"
    - "For Re(s) > 1/2, L_s is compact"
    - "The negative exponent -2s is CRUCIAL — this distinguishes it from classical PF"
  spectrum:
    - spectral_radius: "ρ(L_s)"
    - key_conjecture: "ρ(L_s) < 1 for all s with Re(s) > 1/2"
    - implication: "If ρ(L_s) < 1 for Re(s) > 1/2, then ζ(s) has no zeros there → all zeros on Re(s)=1/2 → RH holds"
  lean_status: |
    formalized (operator object): lean/Riemann/TransferOperator/Operator.lean
    (../riemann) defines noncomputable transferOperator (s : ℂ) on a
    FunctionSpace and transferOperatorBounded s (hs : s.re > 1/2) as the
    →L[ℂ] bounded version with an IsCompactOperator proof;
    TransferOperatorCore.lean adds potential s x = -2·s·log|x| and the
    finite transferMatrix. Weight (n+x)^{-2s} and base map x ↦ 1/(n+x)
    both present. Spectral-radius claims: see TO-RH-Equivalence lean_status
    (partially sorry'd).
  references:
    - type: paper
      id: mayer-1991
      role: "defining paper"
    - type: cypher
      file: "../../../kg/cypher/04-operators.cypher"
  tags: ["transfer-operator", "mayer", "negative-exponent"]

- id: TO-MayerIdentity
  name: "Mayer's Identity: Selberg Zeta = det(1-L_s)det(1+L_s)"
  type: theorem
  category: dynam-systems
  subcategory: selberg-zeta
  statement: |
    For Re(s) > 1:
      Z_S(s) = det(1 - L_s) · det(1 + L_s)
    where Z_S is the Selberg zeta function for PSL(2,ℤ).
  extension: |
    Efrat (1981) extends this to Re(s) > 1/2 via analytic continuation.
    Combined: ζ(2s-1)/ζ(s) = C(s) · det(1-L_s)det(1+L_s) for Re(s) > 1/2
    where C(s) involves gamma and pi factors.
  significance: |
    This connects the Selberg zeta (and via Efrat, ζ(s)) directly to the
    spectral properties of the transfer operator L_s.
    The Riemann Hypothesis becomes a statement about the operator L_s's spectrum.
  proof_status: "proven (Mayer 1991)"
  year: 1991
  lean_status: |
    statement only (proof by sorry): lean/Riemann/FredholmDeterminants.lean
    (../riemann) states mayerIdentity for Re(s) > 1/2 as
    ζ(2s) = C(s) · det(1 - L_s) on a FunctionSpace →L[ℂ] model, plus
    IsTraceClass class, fredholmDet_one/product/ne_zero_iff lemmas,
    transferOperator_isTraceClass, zeta_zero_implies_zeta_2rho_zero —
    15 sorries in the file, so the identity is NOT machine-checked yet.
    Note: Lean uses the one-determinant ζ(2s) form, not the two-determinant
    Z_S = det(1-L_s)det(1+L_s) form above.
  references:
    - type: paper
      id: mayer-1991
    - type: paper
      authors: ["Adolf Efrat"]
      year: 1981
    - type: cypher
      file: "../../../kg/cypher/05-theorems.cypher"
  tags: ["mayer-identity", "selberg-zeta", "determinant", "proven"]

- id: TO-RH-Equivalence
  name: "RH ⇔ ρ(L_s) < 1 for all Re(s) > 1/2"
  type: theorem
  category: dynam-systems
  subcategory: transfer-operator
  statement: |
    The following are equivalent:
    1. RH holds (all non-trivial zeros of ζ(s) have Re(s) = 1/2)
    2. ρ(L_s) < 1 for all s with Re(s) > 1/2
    
    Here ρ(L_s) = spectral radius of Mayer's transfer operator.
  proof_sketch: |
    Mayer identity: Z_S(s) = det(1-L_s)det(1+L_s) for Re(s) > 1
    → poles of Z_S correspond to eigenvalues of L_s with |λ| ≥ 1
    Efrat: Z_S relates to ζ(s) via ζ(2s-1)/ζ(s)
    → zeros of ζ(2s-1) correspond to poles of Z_S
    → RH is equivalent to: no zeros of ζ(2s-1) with Re(2s-1) > 0 and Re(s) > 1/2
    → equivalent to: no eigenvalues of L_s with |λ| ≥ 1 for Re(s) > 1/2
  verification_status: "Semi-formalized in lean/Riemann/TransferOperator.lean (../riemann)"
  confidence: "high for Mayer 1991 identity; NOTE: Efrat 1981 source link unverified (see PA-Efrat-1981-SelbergContinuation) — the Re(s)>1/2 continuation step is provisional"
  caveat: |
    Integrity (2026-08-25): the Efrat 1981 reference currently carries status
    needs-verification (DOI resolves to unrelated paper; seed removed from corpus).
    The equivalence chain Mayer-identity → Efrat-continuation → RH-equivalence is
    therefore NOT fully verified upstream. Independent route: Pollicott–Vytnova 2022
    certified Selberg-zeta computations + Nisoli 2026 certified spectral approximation.
  lean_status: |
    statements formalized, proofs sorry'd (7 sorries): lean/Riemann/
    TransferOperator.lean (../riemann) states spectralRadiusImpliesRH and
    rhImpliesSpectralRadius — both directions of this equivalence — with sorry;
    the Lean comments explicitly flag the Selberg-zeta → ζ(s) connection as not
    yet formalized in Mathlib. TransferOperatorCore.lean goes further
    (riemann_hypothesis, rh_clean using mayer_identity_consequence, 6 sorries);
    PrimeNumberTheorem.lean states riemannHypothesis with sorry'd lemmas;
    CompleteProof.lean's riemannHypothesis is a single sorry stub.
  references:
    - type: paper
      id: mayer-1991
    - type: paper
      authors: ["Adolf Efrat"]
      year: 1981
    - type: lean
      file: "../../../riemann/lean/Riemann/TransferOperator.lean"
      status: "semi-formalized (statements + sorry'd proofs)"
  tags: ["rh-equivalence", "spectral-radius", "mayer", "efrat"]

- id: TO-GaussMap
  name: "Gauss Map"
  type: concept
  category: dynam-systems
  subcategory: transfer-operator
  definition: |
    The Gauss map T: (0,1) → (0,1) defined by
      T(x) = {1/x} = 1/x - ⌊1/x⌋ (fractional part)
    This is the classical continued fraction map.
    The transfer operator L_s is associated with the Gauss map's iterates.
  properties:
    - expanding_map: true
    - ergodic: true (with respect to the Gauss measure)
    - invariant_measure: "Gauss measure μ(x) dx = (1/ln 2) · 1/(1+x) dx"
  connection: |
    The doubly-stochastic operator associated with the Gauss map has
    L₁-spectrum related to periodic orbits, and the Mayer transfer operator
    L_s is a weighted version of this.
  lean_status: |
    formalized (basics): lean/Riemann/TransferOperator/BasicProofs.lean and
    BasicProofs_Complete.lean (../riemann) define gaussMap /
    inverseBranch and prove gaussMap_zero, gaussMap_apply, gaussMap_into_Ico,
    inverseBranch_range, inverseBranch_deriv, inverseBranch_abs_deriv_lt_one,
    sum_inverse_pow_converges / _bounded for σ > 1/2; GaussMapSimple.lean and
    GaussMapCompilable.lean carry the compilable variants. TransferOperatorCore.lean
    and TransferOperator/GaussMap.lean add potential s x = -2·s·log|x| and
    transferMatrix. Some sorries remain (5-8 per file).
  references:
    - type: cypher
      file: "../../../kg/cypher/04-operators.cypher"
    - type: corpus
      paper_id: mayer-1991
  tags: ["gauss-map", "continued-fraction", "expanding", "ergodic"]

