# Experiments from riemann/experiments directory
# GNN, ML, spectral analysis experiments

- id: EX-CM-Forms-Analysis
  name: "Complex Multiplication Forms Analysis"
  type: experiment
  category: machine-learning
  subcategory: cm-detection
  description: |
    Application of ML techniques to detect CM in modular forms using LMFDB data.
    Dataset: 53,779 weight 2 newforms. Features: Fourier coefficients for primes up to 97,
    11 Sato-Tate moments. Model: Gradient Boosting Machines.
  results:
    - metric: F1-Score
      value: 0.900
    - metric: Precision
      value: 0.973
    - metric: Recall
      value: 0.837
    - metric: Accuracy
      value: 0.999
  findings:
    - "CM forms represent only 0.40% of dataset (213/53,779) - challenging class imbalance"
    - "M₄/M₂ ratio is most discriminative feature (importance 0.157)"
    - "Trace coefficients at p=23, 41, 7 contribute significantly"
    - "CM is learnable from small-dimensional feature sets without feature selection"
  status: completed
  date: "2026-06"
  tags:
    - cm-detection
    - gbm
    - lmfdb
    - class-imbalance
  references:
    - file: "experiments/CM_FORMS_ANALYSIS.md"

