  confidence: medium-high (literature chain Isola->Bonanno->Moeller-Pohl->Liverani provides framework; Sprint-2 numerics confirm
    rho<0.30; remaining gap is single HS norm estimate; Efrat replaced by Moeller-Pohl+Liverani)
- id: OP-DataQuantity
  name: 'Data Quantity Gap: Cayley Graphs vs LMFDB Newforms'
  type: gap
  category: machine-learning
  subcategory: gnn-cayley
  statement: 'GNN training on Cayley graphs has only 26 samples (p=2..101).

    ML on LMFDB Hecke traces has 53,404 samples.

    This 3-order-of-magnitude difference explains why GNNs fail and ML succeeds.

    '
  priority: HIGH
  gap_type: insufficient_data
  numbers:
    cayley_graphs:
      total: 26
      fully_computed_eigenvalues: 22
      pending: 4 (p=83, 89, 97, 101)
    lmfdb_newforms:
      total: 63844
      weight_2: 53404
      weight_3: 3168
      weight_4: 5172
      weight_6: 2000
      level_max: 2000
  potential_solutions:
    solution_1:
      name: Generate more small Cayley graphs
      description: p=2..101 gives 26 graphs. p=103..200 would give ~20 more.
      difficulty: MEDIUM — eigenvalue computation is O(N³), N = p(p²-1) ~ millions
      feasibility: Low — p=103 has ~1.1M nodes → 1.3 trillion adjacency entries
    solution_2:
      name: Use different graph families
      description: Other vertex-transitive graphs that are smaller or have known spectra. PSL(2,F_p) is the same as SL(2,F_p)
        for odd p.
    solution_3:
      name: Leverage theoretical relation to Hecke
      description: 'Use Pizer''s theorem: Cayley eigenvalues = Hecke eigenvalues. Use LMFDB''s 53k Hecke traces as PROXY for
        Cayley graph eigenvalues.'
      status: FEASIBLE — this is what Exp 16 (spectral_gap_hecke_correlation.py) tries
      barrier: Script needs Docker + LMFDB data; Docker build currently failing
  current_blocker:
    docker_build: Docker stack broken ( skirt dependency conflicts)
    lmfdb_data: LMFDB PostgreSQL mirror at devmirror.lmfdb.xyz:5432
  references:
  - type: finding
    id: FS-ML-Hecke-Traces-R2-0.73-0.99
  - type: finding
    id: FG-GNN-Subgraph-Negative-R2
  - type: experiment-log
    file: ../../../../riemann/experiments/EXPERIMENT_LOG.md
    section: Cross-experiment comparison
