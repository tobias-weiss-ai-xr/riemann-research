- id: OP-BridgeA-LPS
  name: 'Bridge A: LPS Construction → RH (via Ramanujan)'
  type: bridge
  category: formalization
  subcategory: lean-riemann
  statement: "CONJECTURE: If all SL(2,F_p) Cayley graphs satisfy the Ramanujan property\n(spectral gap λ₂ ≤ 2√3 for all p),\
    \ then the Riemann Hypothesis holds.\n\nThis is the \"Pizer-Brandt Bridge\":\n  SL(2,F_p) Cayley spectral gap = Brandt\
    \ matrix eigenvalues = Hecke eigenvalues\n  = L-function zeros → RH\n"
  status: unresolved
  priority: CRITICAL
  gap_type: missing_implication_chain
  missing_links:
  - link_1:
      from: SL(2,F_p) Cayley spectral gap for ALL p
      to: Brandt matrix eigenvalues
      status: proven
      proof: Pizer's theorem (1981)
  - link_2:
      from: Brandt matrix eigenvalues
      to: Hecke eigenvalues on S₂(Γ₀(p))
      status: proven
      proof: Pizer's theorem (1981)
  - link_3:
      from: Hecke eigenvalues
      to: L-function zeros
      status: proven
      proof: Classical modular form theory
  - link_4:
      from: All L-function zeros on critical line
      to: Riemann Hypothesis
      status: NOT PROVEN — this is LS de Branges' claimed approach (unverified)
      note: de Branges claims a proof but it has never been verified
  current_evidence:
  - 'p=3,5: Ramanujan (λ₂ = 2√3 exactly)'
  - 'p≥7: NOT Ramanujan (λ₂ > 2√3 empirically)'
  - Only 2 out of 26 primes (3,5) are Ramanujan; all others are not
  conclusion: Bridge A is HOPELESS — only p=3,5 satisfy Ramanujan; all others fail. This bridge collapses under the weight
    of empirical evidence.
  references:
  - type: finding
    id: FG-P3P5-Ramanujan
  - type: finding
    id: RP-SL2Fp-Ramanujan
  - type: concept
    id: RP-BrandtPizerHecke
  tags:
  - bridge-a
  - lps
  - ramanujan
  - collapsed
  - Dead end
  confidence: disproven
- id: OP-BridgeB-Mayer
  name: 'Bridge B: Mayer Transfer Operator → RH'
  type: bridge
  category: dinam-systems
  subcategory: transfer-operator
  statement: 'If ρ(L_s) < 1 for all s with Re(s) > 1/2 (Mayer''s transfer operator spectral

    radius is strictly less than 1 in the right half-plane), then RH holds.

    '
  status: partially_proven
  priority: CRITICAL
  gap_type: incomplete_proof
  holes:
    hole_1:
      name: Global spectral radius bound NOT proven
      description: The bound ρ(L_s) < 1 is proven for Re(s) ≥ 1 (trivial) and for large Re(s) (exponential decay), but NOT
        for Re(s) ∈ (1/2, 1).
      difficulty: HARD — requires perturbation theory or spectral gap estimates
      current_status:
      - 'Re(s) > 1: ρ(L_s) < ζ(2σ) ≤ ζ(2) ≈ 1.64 — bounded but > 1'
      - 'Re(s) = 1: ρ(L_s) ≥ 1 (operator norm ≥ 1)'
      - 'Re(s) > 1: Need ρ(L_s) < 1, not just bounded'
      blocking_issue: The operator norm ||L_s|| ≥ ζ(2σ) > 1 for 1 > σ > 1/2. So the spectral radius ρ(L_s) ≥ 1 in this region.
        To have ρ(L_s) < 1, we need strict inequality beyond the norm bound.
    hole_2:
      name: Analytic continuation to Re(s) = 1/2
      description: Mayer's identity holds for Re(s) > 1. Efrat extended to Re(s) > 1/2 for the Selberg zeta. The connection
        to ζ(s) needs careful handling at Re(s) = 1.
    hole_3:
      name: Connection ζ(s) ↔ Selberg Z_S(s)
      description: 'Efrat''s formula: ζ(2s-1)/ζ(s) = C(s) · Z_S(s). The poles of Z_S(s) correspond to eigenvalues of L_s with
        |λ| ≥ 1. The zeros of ζ(s) are at ρ where ζ(ρ) = 0, which may or may not correspond to poles of Z_S.'
      clarification: This does NOT directly give RH. The connection is subtle.
      integrity_update:
        date: '2026-08-25'
        note: 'The Efrat-1981 source link is now status=needs-verification (DOI

          resolves to an unrelated paper; seed removed from corpus). The algebraic

          core — det(I-L_s) = Z(s)^{-1}·Z(s-1) — is independently supported by

          R-Mayer-Identity-Verification-2025. Alternative upstream source for the

          continuation step: Pollicott–Vytnova certified Selberg computations

          + Mayer himself; do NOT build the RH bridge on Efrat alone.

          '
  current_best_approach:
    title: Isola Hilbert space + boundary-corrected operator + HS decomposition (2026-08-25 synthesis)
    description: 'COMBINED STRATEGY (FS-Nuclearity-Synthesis-2026-08):

      1. Isola (2003) Hilbert space H of holomorphic functions (generalized Borel/Laplace transforms, left-invariant under
      L_s)

      2. Boundary-corrected operator L_s^{(0)} = L_s - P_0 (constant mode removed; Sprint-2: rho < 0.30)

      3. HS decomposition: ||A_s||_{HS}^2 ~ Sum n^{-4sigma-2} converges for all sigma > -1/2 (holomorphy O(1/n) + boundary
      correction dissolves 3/4 barrier)

      4. Mayer identity: Moeller-Pohl (2011) Z_S(s) = det(I-L_s) Fredholm determinant (replaces Efrat 1981)

      5. Analytic continuation: Liverani (2005) dynamical determinant entire

      6. Certified rho < 1 for Re(s) >= 3/4+epsilon: Nisoli (2026) DFLY

      7. RH equivalence: det(I-L_s^{(0)}) nonzero for Re(s) > 1/2 → Z_S(s) nonzero → no zeta zeros'
    roadmap_2026:
    - A) Nuclearity extension on the boundary-corrected operator (Re>3/4 → ≥1/2+ε) via Hilbert–Schmidt composition; key estimate
      Σ n^{-2σ} < ∞ (σ>1/2) — EPIC-3
    - 'B) Certified ρ<1 bounds for Re(s) ≥ 3/4+ε: DFLY/quasi-compactness (Gauss-Kuzmin-Wirsing benchmark: 50 eigenvalues,
      ≥90 rigorous digits) + Nisoli-2026 a-posteriori verification — turns FS-Mayer-Spectral-Radius numerics into rigorous
      bounds'
    - C) Track the certified ρ → limit σ → 1/2+ along the numerically stable ridge, feeding the nuclearity extension
    - D) Secure the ζ↔Selberg/continuation stage independently of Efrat-1981 (Pollicott–Vytnova / Mayer route; see hole_3.integrity_update)
    status: framework complete (Isola+Bonanno+Moeller-Pohl+Liverani); single HS norm estimate remains
    gaps:
    - HS norm estimate for boundary-corrected operator on Isola Hilbert space (Sprint 3/4)
    - Nuclearity at Re(s)=1/2 on corrected operator (Sprint 3/4)
    - Certified rho < 1 at Re(s)=1/2 (Sprint 5/6)
  references:
  - type: concept
    id: TO-RH-Equivalence
  - type: finding
    id: FS-Mayer-Spectral-Radius
  - type: finding
    id: TO-Certified-Spectral-Verification
  - type: paper
    id: PA-Nisoli-2026-CertifiedSpectra
  - type: paper
    id: PA-PollicottVytnova-2022-SelbergZeros
  - type: research
    file: ../../../../riemann/research/ASSIGNMENT_4_GLOBAL_BOUND.md
  - type: lean
    file: ../../../../riemann/lean/Riemann/TransferOperator.lean
  - type: finding
    id: FS-Nuclearity-Synthesis-2026-08
  - type: paper
    id: PA-Isola-2003-FareyGaussSpectrum
  - type: paper
    id: PA-Bonanno-2022-FareyComplexTemp
  - type: paper
    id: PA-MoellerPohl-2011-HeckeFredholm
  - type: paper
    id: PA-Liverani-2005-FredholmRuelle
