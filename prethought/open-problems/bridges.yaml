- id: OP-Hadamard-Product-Gap
  name: Hadamard Product Gap in mathlib
  type: gap
  category: formalization
  subcategory: lean-foundation
  statement: 'The Hadamard product of two Dirichlet series is NOT formalized in mathlib.

    This is the SINGLE biggest obstruction to a full RH formalization in Lean.

    The Hadamard product f * g = Σ_n (f_n g_n) n^{-s} for two Dirichlet series

    f = Σ_n f_n n^{-s}, g = Σ_n g_n n^{-s}.

    '
  importance: 'The Hadamard product is used in:

    - Euler product expansions (ζ(s) = Π_p (1 - p^{-s})^{-1})

    - Convolution of multiplicative functions

    - Rankin-Selberg convolution

    - Explicit formulas involving L-functions

    - Many RH equivalences

    Without Hadamard product, we cannot express ζ(s) properly in Lean.

    '
  status: upstream-in-progress
  priority: CRITICAL
  upstream_update: 'UPDATE (2026-01-16, from Zulip PrimeNumberTheorem+ archive):

    The Hadamard FACTORIZATION theorem (a closely related — and for RH

    more important — result) has been FORMALIZED by Matteo Cipollina

    and is PR-ready for mathlib (see ZE-Hadamard-Factorization-DONE).

    It covers the canonical product development: WeierstrassFactor,

    CanonicalProduct, Divisor, LogSingularity, CartanBound, ExpPoly.

    The Dirichlet-series Hadamard product (this entry) is orthogonal but

    the factorization closes the main obstruction to RH formalization.

    '
  difficulty: very-hard
  workaround: null
  references:
  - type: report
    file: ../../../../riemann/MATHLIB_AVAILABILITY_REPORT.md
  - type: plan
    file: ../../../../riemann/MATHLIB_FORK_PLAN.md
  tags:
  - hadamard
  - dirichlet-series
  - mathlib
  - obstruction
  - critical
