  - cayley
  - lmfdb
  - insufficient-samples
  - blocker-docker
  confidence: well-defined
- id: OP-GraphSize
  name: 'Graph Size: Small Primes = Trivial, Large Primes = Intractable'
  type: gap
  category: spectral-theory
  subcategory: cayley-graphs
  statement: 'SL(2,F_p) Cayley graphs have size N = p(p²-1):

    - p=2: 6 nodes — TOO SMALL (trivial graph, not representative)

    - p=3: 24 nodes — OK (first non-trivial)

    - p=5: 120 nodes — OK

    - p=7: 336 nodes — OK

    - p=11: 1320 nodes — OK

    - p=13: 2184 nodes — OK

    - p=17: 4896 nodes — OK

    - p=19: 6840 nodes — challenging;

    - p=23: 12144 nodes — heavy

    - p=29: 24360 nodes — very heavy

    - p=31: 29790 nodes — 2GB adjacency matrix

    - p=37: 50616 nodes

    - p=41: 69720 nodes

    - p=43: 79506 nodes - boundary for GNN training

    - p=47: 103824 nodes — needs distributed GPU

    - p=53: 148872 nodes — p=53 is in the realistic range

    - p=101: 1010100 nodes — IMPOSSIBLE for GNN (1.3TB adjacency sparse)

    '
  priority: MEDIUM
  gap_type: technical_limitation
  solutions:
  - For vertex-transitive graphs, use SPECTRAL theories, not SPATIAL (GNNs)
  - For └-graph processing, use spectral methods (ChebConv works)
  - For p≥50, eigenvalue computation via Lanczos needs optimizing
  references:
