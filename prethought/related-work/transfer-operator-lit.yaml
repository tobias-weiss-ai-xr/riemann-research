- id: PA-Naud-2024-ParabolicZeta
  title: "Dynamical Zeta functions for differentiable parabolic maps of the interval"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2024-03"
  author: "Claudio Bonanno, Roberto Castorrini"
  url: "https://arxiv.org/abs/2403.17700"
  abstract: |
    This paper explores the domain of meromorphic extension for the dynamical zeta function associated to a class of one-dimensional differentiable parabolic maps featuring an indifferent fixed point. We establish the connection between this domain and the spectrum of the weighted transfer operators of the induced map. Furthermore, we discuss scenarios where meromorphic extensions occur beyond the confines of the natural disc of convergence of the dynamical zeta function.
  relevance: |
    Meromorphic continuation domain of dynamical zeta functions linked to spectrum for parabolic (indifferent fixed point) maps — relevant for extending det(I-L_s) meromorphically toward Re(s)=1/2 in the presence of the indifferent Gauss fixed point.
  tags: ["transfer-operator", "selberg-zeta", "rigorous-numerics"]

- id: PA-Fraczek-2010-Gamma0NSymm
  title: "Symmetries of the transfer operator for $Γ_0(N)$ and a character deformation of the Selberg zeta function for $Γ_0(4)$"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2010-11"
  author: "Markus Fraczek, Dieter Mayer"
  url: "https://arxiv.org/abs/1011.4441"
  abstract: |
    The transfer operator for $Γ_0(N)$ and trivial character $χ_0$ possesses a finite group of symmetries generated by permutation matrices $P$ with $P^2=id$. Every such symmetry leads to a factorization of the Selberg zeta function in terms of Fredholm determinants of a reduced transfer operator. These symmetries are related to the group of automorphisms in $GL(2,\mathbb{Z})$ of the Maass wave forms of $Γ_0(N)$ . For the group $Γ_0(4)$ and Selberg's character $χ_α$ there exists just one non-trivial symmetry operator $P$. The eigenfunctions of the corresponding reduced transfer operator with eigenvalue $λ=\pm 1$ are related to Maass forms even respectively odd under a corresponding automorphism. It then follows from a result of Sarnak and Phillips that the zeros of the Selberg function determined by the eigenvalues $λ=-1$ of the reduced transfer operator stay on the critical line under the deformation of the character. From numerical results we expect that on the other hand all the zeros corresponding to the eigenvalue $λ=+1$ leave this line for $α$ turning away from zero.
  relevance: |
    Symmetries of the transfer operator for Gamma_0(N) and character deformation — transfer-operator treatment beyond full modular group relevant to modular/L-function directions.
  tags: ["transfer-operator", "selberg-zeta", "rigorous-numerics"]
