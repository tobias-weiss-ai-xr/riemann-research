- id: RW-Lee-Yang
  name: "Lee-Yang Theorem for Ising Model → RH for Zeros in a Sector"
  type: equivalence
  category: equivalences
  subcategory: null
  statement: |
    RH holds for zeta zeros in the sector |arg(s - 1)| < π/2 - ε if and only
    if the Lee-Yang circle theorem holds for the 1D Ising model in certain regimes.
    More generally: zeros of the partition function for certain statistical
    physics systems lie on a circle ⇨ corresponding RH-type statements.
  status: partial
  notes: "This is an active area of research. The connection is via the
    partition function Z = Σ exp(-β E) and its analytic properties."
  references:
    - type: cypher
      file: "../../../kg/cypher/10-rh-equivalences-extended.cypher"
  tags: ["lee-yang", "Ising", "statistical-physics", "zeros"]

