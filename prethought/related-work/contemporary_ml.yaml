# Contemporary ML and Data-Driven Approaches to RH
# Recent work connecting machine learning to Riemann Hypothesis research

- id: ML-Hayou-2023
  name: "Neural Network Approach via Nyman-Beurling (Hayou 2023)"
  type: approach
  category: machine-learning
  subcategory: neural-networks
  year: 2023
  author: "Siegfried Hayou"
  description: |
    Uses the Nyman-Beurling criterion to reformulate RH as a density problem in L²(0,1).
    Single-layer neural networks can approximate any function in L²(0,1), so this suggests
    training a neural network to verify if the shifted fractional-part functions {f_a}
    span L²(0,1).
  connection: "RH ≡ density of span{f_a : a ∈ (0,1]} = L²(0,1)"
  status: "theoretical"
  confidence: 0.3
  tags: ["neural-networks", "nyman-beurling", "l2-density"]
  references:
    - type: equivalence
      id: RW-Nyman-Beurling

- id: ML-GNN-Spectral-Gap
  name: "GNN Prediction of Cayley Graph Spectral Gaps"
  type: approach
  category: machine-learning
  subcategory: gnn
  year: 2025
  institution: "Riemann Research Project"
  description: |
    Multiple architectures tested (GAT, GCN, ChebConv) on SL(2,F_p) Cayley graphs
    targeting spectral gap λ₂. Consistent failures (R² < 0) due to vertex-transitivity:
    local subgraph features carry zero information about global spectral properties.
  results:
    - GAT on BFS subgraphs: R² = -0.33
    - GCN on full graphs: memory OOM
    - ChebConv on full graphs: R² = -0.08
    - XGBoost on hand-crafted features: R² = 0.31
  status: "failed (but insightful)"
  verdict: "Vertex-transitivity makes local GNNs fundamentally unsuitable"
  tags: ["gnn", "cayley-graphs", "spectral-gap", "vertex-transitive"]
  findings:
    - FG-GNN-Subgraph-Negative-R2
    - FG-GNN-MultiTask-Fails
    - FG-GNN-SIGN-Also-Fails

- id: ML-XGBoost-Hecke
  name: "XGBoost on LMFDB Hecke Traces"
  type: approach
  category: machine-learning
  subcategory: tabular-ml
  year: 2025
  institution: "Riemann Research Project"
  description: |
    sklearn-based ML on 53,779 LMFDB newforms with 25 prime-indexed Hecke eigenvalues
    plus 11 Sato-Tate moments and standardized ratios.
  results:
    - F1-score: 0.900
    - Precision: 0.973
    - Recall: 0.837
    - Accuracy: 0.999
  target: "Complex Multiplication (CM) detection"
  status: "highly successful"
  insight: "Hecke electrodes carry meaningful information; GNNs were bottleneck, not data"
  tags: ["xgboost", "hecke-eigenvalues", "lmfdb", "cm-detection"]
  findings:
    - FS-ML-Hecke-Traces-R2-0.73-0.99
    - FS-SatoTate-Explains-Outliers

- id: ML-Conditional-GAN-Zeros
  name: "Conditional GAN for Zeta Zero Generation"
  type: approach
  category: machine-learning
  subcategory: generative
  year: 2024
  description: |
    Attempt to train a conditional GAN to generate zeta zeros that satisfy GUE statistics.
    Condition on region of the critical strip. Goals: verify Montgomery's pair correlation
    conjecture and Dyson's random matrix theory predictions.
  status: "experimental"
  challenge: "Requires high-quality training data (truncated zeros)"
  tags: ["gan", "generative", "gue", "pair-correlation"]

