- id: PA-ButterleySmania-2025-EssentialRadius
  title: "Discontinuous observables as an obstruction for small essential spectral radius"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2025"
  author: "Oliver Butterley, Daniel Smania"
  url: "https://arxiv.org/abs/2506.07613v1"
  abstract: |
    We show that for a very wide class of Banach spaces of functions on [0,1] there are
    intrinsic lower bounds for the essential spectral radius of the transfer operator
    associated to piecewise smooth expanding maps. The class of Banach spaces studied
    includes any reasonable space which permits discontinuities.
  relevance: |
    NEGATIVE RESULT that constrains our Banach space choice: if the space permits
    discontinuities, the essential spectral radius has intrinsic lower bounds (i.e., it
    cannot be made arbitrarily small). Nuclear ⟺ essential spectral radius = 0. Therefore
    we MUST choose a Banach space of CONTINUOUS (preferably holomorphic/analytic) functions
    — not a space that permits discontinuities. This validates Isola's choice of holomorphic
    function spaces (PA-Isola-2003) and rules out BV/L∞ type spaces.
  gap_addressed: "GAP-1-Nuclearity (which Banach spaces to AVOID for nuclearity)"
  tags: ["essential-spectral-radius", "discontinuous", "banach-space", "negative-result"]

- id: PA-SlipantschukBandtlow-2013-ExplicitSpectra
  title: "Analytic expanding circle maps with explicit spectra"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2013"
  author: "Julia Slipantschuk, Oscar F. Bandtlow, Wolfram Just"
  url: "https://arxiv.org/abs/1306.0445v1"
  abstract: |
    We show that for any λ with |λ|<1 there exists an analytic expanding circle map such
    that the eigenvalues of the associated transfer operator (acting on holomorphic functions)
    are precisely the nonnegative powers of λ and λ̄. As a consequence we obtain a
    counterexample to a variant of a conjecture of Mayer on the reality of spectra of
    transfer operators.
  relevance: |
    Spectra of transfer operators can be ARBITRARILY prescribed (any |λ|<1 achievable).
    This means our spectral radius computation is meaningful and the spectrum is real and
    computable. CAUTION: counterexample to Mayer's conjecture on reality of spectra —
    spectra need NOT be real. But for our purpose (ρ = |max eigenvalue|), this doesn't
    matter. The explicit construction method could be used to benchmark our numerical
    spectral computation.
  gap_addressed: "GAP-4-SpectralRadius (spectra explicitly computable), CAUTION (spectra need not be real)"
  tags: ["explicit-spectra", "expanding-circle", "counterexample-mayer", "holomorphic"]

- id: PA-Nagai-2025-BernoulliFredholm
  title: "From Bernoulli Numbers to Selector Kernels: Fredholm Determinants, ζ-Regularization, and the Bridge Between Discrete and Continuous Spectra"
  type: paper
  category: equivalences
  subcategory: theory
  date: "2025"
  author: "Ken Nagai"
  url: "https://arxiv.org/abs/2511.07495v1"
  abstract: |
    We construct a unified analytic framework connecting Bernoulli numbers, zeta-regularization,
    and Fredholm determinants associated with trigonometric selector kernels. Starting from the
    Bernoulli-Stirling algebra, Euler-Maclaurin corrections are reinterpreted as spectral traces
    of compact operators. This bridge transforms discrete combinatorial data into continuous
    spectral quantities, showing that their determinants interpolate between finite-rank
    projectors and the sine-kernel of random-matrix theory. In the continuum limit the Fredholm
    determinant becomes a Painleve-V tau-function.
  relevance: |
    Conceptual bridge between discrete (Bernoulli numbers, ζ-regularization) and continuous
    (Fredholm determinants, compact operators). The reinterpretation of Euler-Maclaurin as
    spectral traces of compact operators is directly relevant — our L_s has a kernel
    (n+x)^{-2s} and its trace is related to ζ(2s). The Fredholm determinant → Painlevé-V
    τ-function connection is a deep structural link. Speculative but potentially relevant
    for the ζ(s) ↔ det(I-L_s) bridge.
  gap_addressed: "GAP-2-Mayer-Identity (conceptual bridge: ζ-regularization ↔ Fredholm determinant)"
  tags: ["bernoulli", "fredholm", "zeta-regularization", "compact-operator", "spectral-trace"]

- id: PA-DemersLiverani-2026-BilliardsReview
  title: "Recent Progress in the Application of Transfer Operators to Dispersing Billiards"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2026"
  author: "Mark F Demers, Carlangelo Liverani"
  url: "https://arxiv.org/abs/2606.10155v1"
  abstract: |
    This is a review paper about the use of transfer operators to study the statistical
    properties of hyperbolic billiards. The main focus is on equilibrium states, sequential
    billiards, and decay of correlation for billiard flows.
  relevance: |
    Review/overview of transfer operator methodology by two leaders in the field (Demers,
    Liverani). While billiards ≠ continued fractions, the methodological framework (Banach
    spaces, spectral gap, essential spectral radius, nuclearity) transfers. Useful as a
    methodological reference for the choice of Banach space and spectral gap estimates.
  gap_addressed: "GAP-1-Nuclearity (methodological reference for Banach space and spectral gap)"
  tags: ["review", "billiards", "transfer-operator", "spectral-gap", "methodology"]

- id: PA-Grigutis-2025-XiLogDerivative
  title: "Note on the positivity of the real part of the log-derivative of the Riemann ξ-function near the critical line"
  type: paper
  category: number-theory
  subcategory: theory
  date: "2025"
  author: "Andrius Grigutis, Lukas Turčinskas"
  url: "https://arxiv.org/abs/2509.18963v1"
  abstract: |
    In this work, we investigate the positivity of the real part of the log-derivative of the
    Riemann ξ-function in the region 1/2+1/√(log t) < σ < 1, where t is sufficiently large.
    We provide an explicit lower bound for Re Σ 1/(s-ρ), where the summation runs over the
    zeta-zeros on the critical line. We also consider hypothetical cases of positivity of the
    log-derivative of the Riemann ξ-function in the provided region, assuming that there are
    non-trivial zeta-zeros off the critical line.
  relevance: |
    ALTERNATIVE RH criterion via the completed zeta ξ. The log-derivative ξ'/ξ = Σ 1/(s-ρ)
    (sum over zeros). Positivity of Re(ξ'/ξ) near the critical line constrains zero locations.
    This is a different approach from our transfer-operator route but provides a comparative
    benchmark: if we can show ρ(L_s) < 1 ↔ Re(ξ'/ξ) > 0 in some region, that would connect
    the two approaches. Speculative connection, not directly applicable yet.
  gap_addressed: "GAP-5-Alternative-RH (ξ log-derivative positivity, comparative)"
  tags: ["xi-function", "log-derivative", "critical-line", "alternative-rh"]
