  gap_addressed: "GAP-3-RH-Equivalence (Γ₀(p) Maass cusp = 1-eigenfunctions, Hecke connection)"
  tags: ["maass-cusp", "gamma0", "hecke", "1-eigenfunction", "period-function"]

