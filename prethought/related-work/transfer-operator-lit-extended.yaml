- id: PA-Isola-2003-FareyGaussSpectrum
  title: "On the spectrum of Farey and Gauss maps"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2003"
  author: "Stefano Isola"
  url: "https://arxiv.org/abs/math/0308017v1"
  abstract: |
    In this paper we introduce Hilbert spaces of holomorphic functions given by generalized
    Borel and Laplace transforms which are left invariant by the transfer operators of the
    Farey map and its induced version, the Gauss map, respectively. By means of a suitable
    operator-valued power series we are able to study simultaneously the spectrum of both
    these operators along with the analytic properties of the associated dynamical zeta
    functions.
  relevance: |
    FOUNDATION for our nuclearity proof: Isola constructs Hilbert spaces of holomorphic
    functions (via generalized Borel/Laplace transforms) that are LEFT INVARIANT under the
    Farey/Gauss transfer operators. This is exactly the Banach/Hilbert space framework we
    need — if L_s maps a suitable Hilbert space to itself, nuclearity follows from
    Hilbert-Schmidt estimates. The simultaneous study of spectrum + dynamical zeta analytic
    properties is the Mayer-identity framework. Our L_s is the Gauss-map transfer operator
    with complex temperature s.
  gap_addressed: "GAP-1-Nuclearity (Hilbert space framework), GAP-2-Mayer-Identity (zeta-spectrum link)"
  tags: ["farey-map", "gauss-map", "hilbert-space", "holomorphic", "nuclearity", "spectrum"]

- id: PA-Bonanno-2022-FareyComplexTemp
  title: "On the generalised transfer operators of the Farey map with complex temperature"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2022"
  author: "Claudio Bonanno"
  url: "https://arxiv.org/abs/2211.11664v1"
  abstract: |
    We consider the problem of showing that 1 is an eigenvalue for a family of generalised
    transfer operators of the Farey map. This problem is related to the spectral theory of
    the modular surface via the Selberg Zeta function and the theory of dynamical zeta
    functions of maps. After briefly recalling these connections, we show that the problem
    can be formulated for operators on an appropriate Hilbert space and translated into a
    linear algebra problem for infinite matrices.
  relevance: |
    THIS IS OUR EXACT PROBLEM: showing that 1 is (or is not) an eigenvalue of the transfer
    operator with complex temperature. Our Sprint-2 numerics compute the spectral radius of
    the Fourier-basis matrix (which IS an infinite matrix formulation). Bonanno formulates
    this on an appropriate HILBERT SPACE — exactly the setting needed for nuclearity.
    The connection to Selberg Zeta via the Farey map is the Mayer identity. If 1 is NOT an
    eigenvalue for Re(s) > 1/2 (except at zeta zeros), that is RH.
  gap_addressed: "GAP-1-Nuclearity (Hilbert space formulation), GAP-3-RH-Equivalence (1-eigenvalue ↔ Selberg zeros)"
  tags: ["farey-map", "complex-temperature", "hilbert-space", "infinite-matrix", "selberg-zeta"]

- id: PA-BonannoIsola-2009-TwoVariableZeta
  title: "A thermodynamic approach to two-variable Ruelle and Selberg zeta functions via the Farey map"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2009"
  author: "Claudio Bonanno, Stefano Isola"
  url: "https://arxiv.org/abs/0907.1471v4"
  abstract: |
    In this paper we consider the transfer operator approach to the Ruelle and Selberg zeta
    functions associated to continued fractions transformations and the geodesic flow on the
    full modular surface. We extend the results by Ruelle and Mayer to two-variable zeta
    functions, ζ(q,z) and Z(q,z). The q variable plays the role of the inverse temperature
    and the introduction of the "geometric variable" z is essential in the tentative to
    provide a general approach, based on the Farey map, to the correspondence between the
    analytic properties of the zeta functions themselves, the spectral properties of a class
    of generalised transfer operators P^±_q and the theory of a generalisation of the
    three-term functional equations studied by Lewis and Zagier.
  relevance: |
    Extends Mayer's results to TWO-VARIABLE zeta functions with q = inverse temperature
    (= our complex s). The signed transfer operators P^±_q are the generalization of our
    L_s. The Lewis-Zagier three-term functional equation is the classical relation for
    period functions of Maass forms. This paper provides the thermodynamic-formalism
    framework for our setting: complex temperature, Farey map, Selberg zeta, transfer
    operator spectrum — all connected.
  gap_addressed: "GAP-2-Mayer-Identity (two-variable extension), GAP-3-RH-Equivalence (thermodynamic framework)"
  tags: ["farey-map", "two-variable-zeta", "ruelle", "selberg-zeta", "lewis-zagier", "complex-temperature"]

- id: PA-MoellerPohl-2011-HeckeFredholm
  title: "Period functions for Hecke triangle groups, and the Selberg zeta function as a Fredholm determinant"
  type: paper
  category: dynam-systems
  subcategory: selberg-zeta
  date: "2011"
  author: "M. Möller, A. D. Pohl"
  url: "https://arxiv.org/abs/1103.5235v2"
  abstract: |
    We characterize Maass cusp forms for any cofinite Hecke triangle group as 1-eigenfunctions
    of appropriate regularity of a transfer operator family. This transfer operator family is
    associated to a certain symbolic dynamics for the geodesic flow on the orbifold arising as
    the orbit space of the action of the Hecke triangle group on the hyperbolic plane. Moreover
    we show that the Selberg zeta function is the Fredholm determinant of the transfer operator
    family associated to an acceleration of this symbolic dynamics.
  relevance: |
    RIGOROUS PROOF of the Mayer identity for Hecke triangle groups: Z_S(s) = det(1-L_s) (as
    Fredholm determinant). This is EXACTLY the algebraic core of our Bridge B. Hecke triangle
    groups include PSL(2,Z) (q=3) as a special case. The transfer operator family arises
    from symbolic dynamics of the geodesic flow. Maass cusp forms = 1-eigenfunctions ( connects
    to the ρ(L_s)=1 question). This paper provides the formal foundation that our TO-MayerIdentity
    and R-Mayer-Identity-Verification-2025 rely on.
  gap_addressed: "GAP-2-Mayer-Identity (Fredholm determinant = Selberg zeta, rigorous proof)"
  tags: ["hecke-triangle", "fredholm-determinant", "selberg-zeta", "maass-cusp", "transfer-operator"]

- id: PA-Liverani-2005-FredholmRuelle
  title: "Fredholm determinants, Anosov maps and Ruelle resonances"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2005"
  author: "Carlangelo Liverani"
  url: "https://arxiv.org/abs/math/0505049v1"
  abstract: |
    I show that the dynamical determinant, associated to an Anosov diffeomorphism, is the
    Fredholm determinant of the corresponding Ruelle-Perron-Frobenius transfer operator acting
    on appropriate Banach spaces. As a consequence it follows, for example, that the zeroes of
    the dynamical determinant describe the eigenvalues of the transfer operator and the Ruelle
    resonances and that, for C^∞ Anosov diffeomorphisms, the dynamical determinant is an
    entire function.
  relevance: |
    Proves det(I-L) = dynamical determinant = Fredholm determinant on appropriate Banach
    spaces, and that the dynamical determinant is ENTIRE (analytic everywhere). The entire-ness
    is crucial for analytic continuation to Re(s)=1/2 — our Bridge B needs the zeta/determinant
    to be analytic in the critical strip. Ruelle resonances = eigenvalues of L. This is the
    general framework subsuming the Mayer identity. The "appropriate Banach spaces" are the
    key — Liverani's choice of Banach space determines nuclearity.
  gap_addressed: "GAP-2-Mayer-Identity (Fredholm = dynamical determinant), GAP-1-Nuclearity (Banach space choice)"
  tags: ["fredholm", "ruelle-resonances", "anosov", "banach-space", "entire-function"]

