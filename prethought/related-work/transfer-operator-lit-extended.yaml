# Source: papers.yaml (3460 papers) — systematic keyword search for nuclearity, Fredholm,
# Farey/Gauss with complex temperature, essential spectral radius, anisotropic Banach, etc.
# Each paper assessed for contribution to our 5 specific gaps (Bridge B / EPIC-3).

