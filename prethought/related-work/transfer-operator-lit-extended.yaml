- id: PA-GiuliettiLiverani-2014-AnisotropicBanach
  title: "Parabolic dynamics and Anisotropic Banach spaces"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2014"
  author: "Paolo Giulietti, Carlangelo Liverani"
  url: "https://arxiv.org/abs/1412.7181v5"
  abstract: |
    We investigate the relation between the distributions appearing in the study of ergodic
    averages of parabolic flows (e.g. in the work of Flaminio-Forni) and the ones appearing
    in the study of the statistical properties of hyperbolic dynamical systems (i.e. the
    eigendistributions of the transfer operator). In order to avoid, as much as possible,
    technical issues that would cloud the basic idea, we limit ourselves to a simple flow on
    the torus. Our main result is that, roughly, the growth of ergodic averages of a parabolic
    flows is controlled by the eigenvalues of a suitable transfer operator associated to the
    renormalising dynamics.
  relevance: |
    MODERN TOOL for nuclearity: anisotropic Banach spaces are the state-of-the-art framework
    for transfer operators on spaces with indifferent/parabolic fixed points (our Gauss map
    has one at 0). The key insight: ergodic averages of parabolic flows are controlled by
    transfer operator eigenvalues. If we choose the right anisotropic Banach space, the
    transfer operator may be nuclear/compact where it fails on standard spaces. This could
    be the key to extending nuclearity from Re(s)>3/4 to Re(s)≥1/2+ε.
  gap_addressed: "GAP-1-Nuclearity (anisotropic Banach space framework for parabolic/indifferent dynamics)"
  tags: ["anisotropic", "banach-space", "parabolic", "ergodic-averages", "nuclearity"]

- id: PA-Garibaldi-2021-IndifferentFixed
  title: "A Ruelle-Perron-Frobenius theorem for expanding circle maps with an indifferent fixed point"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2021"
  author: "Eduardo Garibaldi, Irene Inoquio-Renteria"
  url: "https://arxiv.org/abs/2111.12882v1"
  abstract: |
    In this note, we establish an original result for the thermodynamic formalism in the
    context of expanding circle transformations with an indifferent fixed point. For an
    observable whose continuity modulus is linked to the dynamics near such a fixed point,
    by identifying an appropriate linear space to evaluate the action of the transfer
    operator, we show that there is a strictly positive eigenfunction associated with the
    maximal eigenvalue given as the exponential of the topological pressure. Taking into
    account also the corresponding eigenmeasure, the invariant probability thus obtained is
    proved to be the unique Gibbs-equilibrium state of the system.
  relevance: |
    The Gauss map has an INDIFFERENT FIXED POINT at 0 (the parabolic point of the continued
    fraction map). This paper proves a Ruelle-PF theorem (positive eigenfunction, maximal
    eigenvalue = exp(topological pressure)) for maps WITH indifferent fixed points. If we
    can show exp(pressure) < 1 for Re(s) > 1/2, that is exactly our ρ(L_s) < 1. The choice
    of "appropriate linear space" is the Banach space question (connects to Giulietti-Liverani).
  gap_addressed: "GAP-1-Nuclearity (indifferent fixed point = our Gauss map case), GAP-4-SpectralRadius (max eigenvalue = exp(pressure))"
  tags: ["indifferent-fixed-point", "ruelle-pf", "topological-pressure", "gibbs-equilibrium"]

- id: PA-BandtlowJenkinson-2008-RuelleEigenvalue
  title: "On the Ruelle eigenvalue sequence"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2008"
  author: "Oscar F. Bandtlow, Oliver Jenkinson"
  url: "https://arxiv.org/abs/0802.1468v1"
  abstract: |
    For certain real analytic data, we show that the eigenvalue sequence of the associated
    transfer operator L is insensitive to the holomorphic function space on which L acts.
    Explicit bounds on this eigenvalue sequence are established.
  relevance: |
    KEY VALIDATION: the eigenvalue sequence (hence spectral radius) is INSENSITIVE to the
    choice of holomorphic function space. This means our numerical spectral radius computation
    does not depend on the specific Banach/Hilbert space choice — a crucial robustness
    property. The explicit bounds on the eigenvalue sequence can be used to certify our ρ<1
    measurements. Connects to Nisoli 2026 (certified spectral approximation): both concern
    the stability and computability of transfer operator spectra.
  gap_addressed: "GAP-4-SpectralRadius (space-insensitive eigenvalue bounds), GAP-1-Nuclearity (space choice doesn't matter)"
  tags: ["eigenvalue-sequence", "holomorphic", "space-insensitive", "spectral-radius", "bounds"]

- id: PA-Pohl-2012-MaassCuspDynamical
  title: "A dynamical approach to Maass cusp forms"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2012"
  author: "Anke D. Pohl"
  url: "https://arxiv.org/abs/1208.6178v2"
  abstract: |
    For nonuniform cofinite Fuchsian groups Γ which satisfy a certain additional geometric
    condition, we show that the Maass cusp forms for Γ are isomorphic to 1-eigenfunctions of
    a finite-term transfer operator. The isomorphism is constructive.
  relevance: |
    Maass cusp forms ↔ 1-eigenfunctions of a finite-term transfer operator. This is the
    Lewis-Zagier connection made constructive. If ρ(L_s) = 1 corresponds to Maass cusp form
    eigenvalues, then the absence of 1-eigenvalues for Re(s) > 1/2 (except at zeta zeros)
    is related to RH. The "finite-term" transfer operator is computationally tractable
    (unlike infinite-term operators). For PSL(2,Z) (our case), this applies directly.
  gap_addressed: "GAP-3-RH-Equivalence (Maass cusp forms = 1-eigenfunctions, Lewis-Zagier)"
  tags: ["maass-cusp", "1-eigenfunction", "fuchsian", "lewis-zagier", "finite-term"]

- id: PA-Pohl-2012-MaassCuspGamma0p
  title: "Period functions for Maass cusp forms for Γ₀(p): a transfer operator approach"
  type: paper
  category: dynam-systems
  subcategory: transfer-operator
  date: "2012"
  author: "Anke D. Pohl"
  url: "https://arxiv.org/abs/1203.5510v1"
  abstract: |
    We characterize the Maass cusp forms for Hecke congruence subgroups of prime level as
    1-eigenfunctions of a finite-term transfer operator.
  relevance: |
    Same as PA-Pohl-2012-MaassCuspDynamical but for Γ₀(p) — directly relevant to our SL(2,F_p)
