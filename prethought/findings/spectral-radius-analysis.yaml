# EPIC-4 Spectral Radius Analysis — the spectral radius bound IS equivalent to RH

- id: FS-SpectralRadius-Analysis-2026-08
  name: "EPIC-4: Spectral radius bound rho(L_s) < 1 for Re(s) > 1/2 IS equivalent to RH — partial results and the 3/4 to 1/2 gap"
