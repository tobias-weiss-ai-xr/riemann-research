  implications: |
    The spectral-radius obstruction sits in the CONSTANT Fourier mode / boundary
    condition, not in the t-direction. The numerical failure of the naive definition
    precisely matches the KB-Nuclearity-Gap at Re(s)<=3/4. The Mayer boundary
    correction (removing the constant mode) restores ρ<1 across the critical line,
    numerically supporting Bridge B. Next: formalize the boundary correction in
    Mayer's framework (nuclear operator on appropriate subspace) in Lean.
