- id: FG-Vertex-Transitive-Curse
  name: "The Vertex-Transitive Curse: Local Features Carry Zero Global Information"
  type: finding
  category: machine-learning
  subcategory: gnn-cayley
  experiment: ["Exp 2", "Exp 3"]
  date: "2026-04-18"
  abstract: |
    For vertex-transitive graphs (like SL(2,F_p) Cayley graphs with fixed generators),
    all nodes are structurally identical. Any local neighborhood of radius r looks
    the same regardless of which node you start from, and regardless of the prime p.
    Therefore, any GNN that uses only local message passing cannot distinguish
    between different primes, and thus cannot predict prime-dependent global
    properties like the spectral gap.
  implications:
    - "GNNs CANNOT learn global spectral properties from local subgraph sampling"
    - "Full-graph processing is REQUIRED for vertex-transitive graph tasks"
    - "Cross-prime generalization for Cayley graphs is HOPLESS with local features"
  proof:
    |-
      (1) SL(2,F_p) Cayley graphs with generators S,R are vertex-transitive
      (2) Vertex-transitive ⇒ all nodes have identical local neighborhoods
      (3) Local GNN features = f(local neighborhood)
      (4) ⇒ All nodes in all SL(2,F_p) graphs have identical GNN features
      (5) ⇒ GNN output depends only on global pooling of identical features
      (6) ⇒ No information about p flows through the network
      (7) ⇒ Cannot generalize to new primes
  references:
    - type: concept
      id: CG-SL2Fp
    - type: talking-point
      id: CS-Vertex-Transitive-Limitation
    - type: experiment-log
      file: "../../../../riemann/experiments/EXPERIMENT_LOG.md"
  tags: ["vertex-transitive", "theoretical-limit", "no-local-info", "proven-curse"]
  status: "proven"
  confidence: "very-high"
