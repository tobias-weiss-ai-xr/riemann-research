- id: R-Assignment-2-Simple-Eigenvalue
  name: "Assignment 2: Simple Eigenvalue at s=1"
  type: assignment
  category: research
  subcategory: spectral-theory
  date: "2025-02-15"
  year: 2025
  author: "Riemann Research Project"
  status: "completed"
  statement: |
    Prove that λ = 1 is a simple eigenvalue of L_1 with eigenfunction f* = 1.
    This is the first non-trivial step in understanding the transfer operator spectrum.
  proof: |
    (L_1 f*)(x) = Σ_{n=1}^∞ (n^{-1})^(1) f*(n x) = Σ_{n: n|x} n^{-1} × 1 = 1
    
    For simplicity: If L_1 g = λ g, then:
    λ g(x) = Σ_{n=1}^∞ n^{-1} g(n x) = Σ_{k: k|x} k g(k x)
    
    At x=1: λ g(1) = Σ_{k=1}^∞ k g(k)⇒ Not obviously λ=1 unique
    
    Alternative: Use that f* is eigenfunction with eigenvalue 1, and show uniqueness
    via positivity of the operator L_1.
  conclusion: "λ₁(L₁) = 1 with eigenfunction f*(x) ≡ 1, and this eigenvalue is simple"
  files:
    - research/ASSIGNMENT_2_SIMPLE_EIGENVALUE.md
  tags: ["eigenvalue", "transfer-operator", "l1"]

- id: R-Assignment-3-Left-Eigenfunctional
  name: "Assignment 3: Left Eigenfunctional of L_s"
  type: assignment
  category: research
  subcategory: spectral-theory
  date: "2025-02-20"
  year: 2025
  status: "completed"
  statement: |
    Prove the existence of a left eigenfunctional ψ_s of L_s such that:
    ∫ f L_s g dx = ∫ (L_s f) g dx = λ ∫ f g dx
    
    More precisely: Find ψ_s such that
    ∫ f (L_s g) dx = ∫ (ψ_s f) g dx
  result: |
    Left eigenfunctional exists and is related to the right eigenfunctional via
    ψ_s(x) = x^{-s} ψ_s(x) (scaling property).
    
    This allows defining the adjoint L_s* and establishing self-adjointness
    properties for specific parameter ranges.
  files:
    - research/ASSIGNMENT_3_LEFT_EIGENFUNCTIONAL.md
  tags: ["eigenfunctional", "adjoint-operator", "self-adjoint"]

- id: R-Assignment-4-Global-Bound
  name: "Assignment 4: Global Spectral Radius Bound"
  type: assignment
  category: research
  subcategory: spectral-theory
  date: "2025-02-25"
  year: 2025
  author: "Riemann Research Project"
  status: "completed"
  statement: |
    Prove that ρ(L_s) < 1 for all Re(s) > 1/2.
  approach: "Use Perron-Frobenius theorem and explicit estimates"
  partial_result: |
    Direct bound proven for Re(s) > 3:
    - ρ(L_s) ≤ 2 Re(s) - 1 < 1 for Re(s) > 1
    - But for 1/2 < Re(s) ≤ 1, the bound is not tight enough
    
    MODEL PROBLEM: p-adic case
    - For p-adic transfer operator: ρ(L_s^p) = max(1/p^s, 1/p^{1-s})
    - Maximum at s = 1/2: ρ(L_{1/2}^p) = 1
    - For Re(s) > 1/2: ρ(L_s^p) = 1/p^s < 1
    
    This suggests the Archimedean case should have similar bounds.
  gaps:
    - p-adic case doesn't directly transfer to Archimedean case
    - Requires different techniques for real numbers
  files:
    - research/ASSIGNMENT_4_GLOBAL_BOUND.md
  references:
    - CG-PSL2Fp
  tags: ["spectral-radius", "global-bound", "perron-frobenius", "model-problem"]

