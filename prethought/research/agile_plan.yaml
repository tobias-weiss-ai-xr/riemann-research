- id: DOD-1
  name: "Definition of Done: RH Proof"
  type: roadmap
  category: planning
  subcategory: definition-of-done
  date: "2026-01-15"
  year: 2026
  status: defined
  confidence: 1.0
  statement: |
    The Riemann Hypothesis is considered "proven" in this project when:

    1. lake build → 0 errors (whole project compiles)
    2. No sorry, no axiom in any .lean file
    3. RiemannHypothesis.lean contains the theorem: ρ(L_{1/2+it}) < 1 → RH
    4. TransferOperator.lean contains: IsNuclear (L s) for Re(s) ≥ 1/2 + ε
    5. SpectralRadius.lean contains: spectralRadius (L (1/2 + I*t)) < 1
    6. Numerical verification confirms ρ < 1 for |t| < 100
    7. Independent compilation on a clean machine
    8. Honest status: "RH proven IF nuclearity holds at Re(s) = 1/2"

    NOTE: Until all 8 criteria are met, RH is NOT proven.
    The stoic response: accept what is, not what we wish.
  criteria:
    - "lake build → 0 errors"
    - "No sorry, no axiom"
    - "RiemannHypothesis.lean: ρ(L_{1/2+it}) < 1 → RH"
    - "TransferOperator.lean: IsNuclear (L s) for Re(s) ≥ 1/2 + ε"
    - "SpectralRadius.lean: spectralRadius (L (1/2 + I*t)) < 1"
    - "Numerical verification: ρ < 1 for |t| < 100"
    - "Independent compilation"
    - "Honest status document"
  tags: ["definition-of-done", "rh-proof", "verification"]

