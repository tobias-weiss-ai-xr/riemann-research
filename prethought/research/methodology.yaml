- id: PHIL-Numerical-First
  name: "Strategy: Numerical Verification Before Proof"
  type: strategy
  category: methodology
  subcategory: strategy
  date: "2026-01-01"
  year: 2026
  status: defined
  statement: |
    Before attempting a formal proof, verify the conjecture numerically.
    This catches errors early and provides evidence (not proof) that guides
    the proof strategy.

    Numerical verification pipeline:
    1. State the conjecture precisely (Lean signature)
    2. Compute the relevant quantity numerically (Python/sage)
    3. Check the conjecture holds for small cases
    4. If it fails: ABORT (fail fast)
    5. If it holds: Proceed to formal proof
    6. If formal proof is hard: Publish numerical evidence as a finding

    Success stories:
    - Friedli constant: Computed ≈ 1.1367 numerically, then confirmed analytically
    - LMFDB Hecke traces: ML R² 0.73-0.99 confirmed patterns before theory
    - p=3,5 Ramanujan: Computed eigenvalues, confirmed λ₂ ≤ 2√3, then proved in Lean

    Failures caught early:
    - GNN spectral gap prediction: R² < 0 on cross-prime test → ABORTED
    - Enhanced Pizer slopes: Noise dominates for p ≥ 47 → redirected approach
  tools:
    - "scripts/compute_eigenvalues.py: Sparse Lanczos eigenvalue computation"
    - "scripts/train_lmfdb_ml_53k.py: sklearn ML on 53k LMFDB newforms"
    - "scripts/augment_dataset.py: BFS subgraph extraction"
    - "lake build: Formal verification"
  tags: ["numerical-verification", "fail-fast", "evidence-based"]

