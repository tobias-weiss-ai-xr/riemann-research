# Minimal Stoic Unix Philosophy Applied to RH
# Principles for efficient and effective mathematical research
# Key insight: Do one thing well, keep minimal, fail fast, compose, cache

# ============================================================
# PHILOSOPHY PRINCIPLES
# ============================================================

- id: PHIL-Minimal-Stoic-Unix
  name: "Minimal Stoic Unix Philosophy for Mathematical Research"
  type: philosophy
  category: methodology
  subcategory: principles
  date: "2026-01-01"
  year: 2026
  status: defined
  confidence: 0.95
  statement: |
    A methodology for approaching the Riemann Hypothesis (and hard mathematical
    problems generally) based on three traditions:

    1. MINIMALISM: Prove the smallest sufficient lemma. Don't prove everything;
       prove the one thing that matters. Remove everything that is not necessary.

    2. STOICISM: Accept what is proven, reject what is not. Distinguish rigorously
       between established results, conjectures, and speculation. Never claim more
       than the evidence supports. The gap between "RH PROVEN" claims and honest
       assessment is the primary integrity risk.

    3. UNIX PHILOSOPHY: Write small composable tools (Lean files) that each do one
       thing well. Expect the output of every proof to be the input to another.
       Build early, test often. Use cache (mathlib) rather than rebuild. Keep
       everything text-based and greppable (YAML knowledge base).

    Applied to RH: Don't attempt a full proof. Instead, identify the narrowest gap
    (Bridge B: Mayer transfer operator spectral radius at Re(s) = 1/2), prove that
    one lemma, and let the existing equivalence chain carry the rest.
  principles:
    - "Do one thing well: Prove ONE lemma, not the whole theorem"
    - "Keep minimal: Remove every assumption that is not needed"
    - "Fail fast: Test conjectures numerically before attempting proofs"
    - "Compose: Build modular proofs that chain via Lean imports"
    - "Cache: Reuse mathlib, don't reinvent nuclear operator theory"
    - "Text streams: YAML knowledge base is greppable, diffable, versionable"
    - "Stoic acceptance: Accept what is proven, reject what is not"
    - "Integrity first: Never claim more than the evidence supports"
  references:
    - DOC-Absolute-Trust
    - R-Gap-Analysis-2025
  tags: ["philosophy", "methodology", "minimalism", "stoicism", "unix"]

