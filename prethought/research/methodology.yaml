# ============================================================
# ANTI-PATTERNS (What NOT to do)
# ============================================================

- id: PHIL-AntiPatterns
  name: "Anti-Patterns: What NOT to Do"
  type: warning
  category: methodology
  subcategory: anti-patterns
  date: "2026-01-01"
  year: 2026
  status: confirmed
  confidence: 1.0
  statement: |
    Patterns that have been tried and failed, or that violate the minimal stoic
    Unix philosophy. These should be avoided.

    ANTI-PATTERN 1: Premature "RH PROVEN" Claims
    - Files: ABSOLUTE_TRUST.md, PROOF_COMPLETE.md, RH_FINAL_PROOF_SIMPLE.md,
      RIEMANN_HYPOTHESIS_FINAL_PROOF.md, RIEMANN_HYPOTHESIS_PROOF_FINAL.md
    - Problem: Claim RH is proven when gaps remain
    - Stoic response: "RH is NOT proven. The gap is nuclearity at Re(s) = 1/2."
    - Integrity impact: Destroys trust in actual results

    ANTI-PATTERN 2: Local GNNs on Vertex-Transitive Graphs
    - Files: train_gnn.py, train_chebconv.py, train_hecke_gnn.py, train_farey_gnn.py
    - Problem: Local features on vertex-transitive graphs carry zero global information
    - Evidence: 5 different GNN architectures, all R² < 0 on cross-prime test
    - Stoic response: "Abandoned. Vertex-transitive curse is proven."
    - KB entity: FG-Vertex-Transitive-Curse (confidence: very-high)

    ANTI-PATTERN 3: Strict Hilbert-Pólya
    - Problem: Sarnak & Xakaboylu (2019) disproved the strict form
    - Stoic response: "Use the Mayer transfer operator form instead (Bridge B)"

    ANTI-PATTERN 4: Over-engineering Infrastructure
    - Problem: Building Dgraph schemas, taskfleet orchestrators, and ML pipelines
      before the math is solid
    - Stoic response: "Math first, infrastructure second. YAML is enough."
    - Unix response: "Do one thing well. The math is the thing. Infrastructure
      supports it, not replaces it."

    ANTI-PATTERN 5: Claiming More Than the Evidence Supports
    - Problem: ABSOLUTE_TRUST.md claims "100% mathematical trust" when gaps exist
    - Stoic response: "Every claim has a confidence field. Use it."
    - KB solution: PHIL-Integrity-Audit entity with honest assessment

    ANTI-PATTERN 6: Reinventing Mathlib
    - Problem: Building custom nuclear operator theory instead of using mathlib
    - Unix response: "Cache, don't rebuild. Use mathlib. Contribute gaps upstream."
    - Specific gap: Hadamard product is missing from mathlib. Solution: contribute
      to mathlib, don't fork.

    ANTI-PATTERN 7: Persisting After Numerical Failure
    - Problem: Continuing to develop GNN approaches after R² < 0
    - Stoic response: "Fail fast. If R² < 0, abandon the approach."
    - Lesson: 5 GNN architectures failed. The lesson is in the failure, not in
      trying a 6th architecture.
