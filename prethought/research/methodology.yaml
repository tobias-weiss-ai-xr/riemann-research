- id: PHIL-Keep-Minimal
  name: "Principle: Keep Minimal"
  type: philosophy
  category: methodology
  subcategory: principles
  date: "2026-01-01"
  year: 2026
  status: defined
  statement: |
    Remove every assumption, every dependency, every line of code that is not
    strictly necessary. The fewer moving parts, the fewer places for errors.

    Applied to the RH project:
    - Cayley graph approach: 5 different GNN architectures all FAILED (FG-Vertex-Transitive-Curse).
      Minimal lesson: Local features on vertex-transitive graphs carry ZERO global information.
      Remove GNN approaches entirely.
    - Lean formalization: Only import what you need. 4 imports, not 40.
    - Knowledge base: YAML, not a database server. Grep, not SQL.
    - Dgraph: Only when graph queries are needed. YAML for everything else.
  anti_patterns:
    - "Premature generalization: Proving a more general theorem than needed"
    - "Over-engineering: Building infrastructure before the theorem is proven"
    - "Feature creep: Adding ML models when the math is not yet solid"
    - "Claim inflation: Saying 'RH PROVEN' when only partial results exist"
  tags: ["minimalism", "removal", "simplicity"]

- id: PHIL-Fail-Fast
  name: "Principle: Fail Fast"
  type: philosophy
  category: methodology
  subcategory: principles
  date: "2026-01-01"
  year: 2026
  status: defined
  statement: |
    Test conjectures numerically before attempting proofs. If a conjecture fails
    numerically, abandon it immediately. Do not invest months in a proof that
    a 5-minute computation could have refuted.

    Applied:
    - GNN on Cayley graphs: Failed FAST (R² < 0). Lesson: vertex-transitive graphs
      cannot be solved by local methods. Abandoned, not persisted.
    - Pizer slopes: Enhanced Pizer experiment showed noise dominates signal for p ≥ 47.
      This is a SIGNAL to redirect, not a failure to hide.
    - Friedli constant: Computed numerically (≈ 1.1367), confirmed analytically.
      Numerical verification BEFORE formal proof.
    - Bridge A (LPS): Collapsed because LPS construction knowledge was missing.
      Better to discover this in 1 day than 1 year.
  methodology:
    - "Before proving X numerically: Can X be computed?"
    - "Before computing X: What is the simplest test case?"
    - "Before formalizing X: Is X true? (numerical check)"
    - "Before publishing X: Is X verified? (formal check)"
  tags: ["fail-fast", "numerical-verification", "honesty"]

