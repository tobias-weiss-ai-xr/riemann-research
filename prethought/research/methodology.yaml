- id: PHIL-Cache-Not-Rebuild
  name: "Principle: Cache, Don't Rebuild"
  type: philosophy
  category: methodology
  subcategory: principles
  date: "2026-01-01"
  year: 2026
  status: defined
  statement: |
    Reuse mathlib. Do not reinvent nuclear operator theory, spectral theory,
    or functional analysis from scratch. Use `lake exe cache get` to pull
    prebuilt .olean files (8678 files cached).

    Applied:
    - Lean toolchain pinned to v4.33.0-rc1 (matches mathlib cache)
    - Import Mathlib.Data.Complex.Basic, Mathlib.Algebra.Star.Basic,
      Mathlib.Analysis.Normed.Field.Basic — not the entire Mathlib
    - Use Star.star (conj notation) to bridge to RCLike.norm_conj and
      Complex.conj_cpow — don't redefine conjugation
    - Use List.foldr/List.map from Mathlib.Data.List.Basic — don't reimplement
    - The Hadamard product gap in mathlib is the single biggest obstruction.
      Don't try to fill it alone; contribute to mathlib instead.
  cache_strategy:
    - "8678 prebuilt oleans from lake exe cache get"
    - "4 imports, not 40 (minimal dependencies)"
    - "Star.star bridging to existing mathlib lemmas"
    - "Hadamard product: contribute to mathlib, don't fork"
  tags: ["cache", "mathlib", "reuse", "efficiency"]

- id: PHIL-Text-Streams
  name: "Principle: Text Streams and Greppability"
  type: philosophy
  category: methodology
  subcategory: principles
  date: "2026-01-01"
  year: 2026
  status: defined
  statement: |
    All knowledge should be text-based, greppable, diffable, and versionable.
    YAML for knowledge, Lean for proofs, Markdown for research notes.
    No binary formats, no databases as source of truth (Dgraph is a derivative
    index, not the primary store).

    The prethought/ YAML directory IS the knowledge base. Dgraph is a query
    index on top of it. If Dgraph dies, the YAML still works. If YAML dies,
    everything dies.

    Applied:
    - prethought/*.yaml → primary knowledge store (273 entities, 30 files)
    - kg/dgraph/ → derivative index (queryable, but not source of truth)
    - lean/*.lean → formal proofs (source of truth for formalization)
    - research/*.md → mathematical research (source of truth for proofs)
    - lake build → verification (not source of truth, but verification of it)
  tools:
    - "grep: Search across all YAML, Lean, and Markdown files"
    - "diff: Track what changed between commits"
    - "git: Version everything, including knowledge base"
    - "lake build: Verify formal proofs compose correctly"
    - "Dgraph: Query the knowledge graph (derivative, not primary)"
  tags: ["text-streams", "greppability", "yaml", "unix-tools"]

- id: PHIL-Stoic-Acceptance
  name: "Principle: Stoic Acceptance (Integrity First)"
  type: philosophy
  category: methodology
  subcategory: integrity
  date: "2026-01-01"
  year: 2026
  status: defined
  confidence: 1.0
  statement: |
    The single most important principle: Accept what is proven, reject what is not.
    The gap between "RH PROVEN" (ABSOLUTE_TRUST.md) and the honest assessment
    (R-Gap-Analysis-2025: "RH NOT PROVEN - significant gaps identified") is the
    primary integrity risk in this project.

    What IS proven:
    - p=3,5 Cayley graphs are Ramanujan (lean/RamanujanProperty.lean, 0 sorry)
    - Friedli constant ≈ 1.1367 (numerical + analytical)
    - ML on LMFDB Hecke traces achieves R² 0.73-0.99 (confirmed, very-high)
    - GNN on Cayley graphs FAILS (proven, vertex-transitive curse)
    - Mayer identity: det(I - L_s) = Z(s)^{-1} × Z(s-1) (assumed from literature)
    - L_s is nuclear for Re(s) > 3/4 (proven, confidence 0.90)
    - Equivalence: RH ↔ ρ(L_{1/2+it}) < 1 (proven, confidence 0.90)

    What is NOT proven:
    - RH itself (gap in nuclearity at Re(s) = 1/2)
    - ρ(L_{1/2+it}) < 1 for all t (the critical missing lemma)
    - Bridge A (LPS construction knowledge missing)
    - Hilbert-Pólya strict form (disproven by Sarnak/Xakaboylu 2019)

    The stoic response: Accept both lists. Do not inflate the first. Do not
    despair over the second. Focus on the narrowest gap.
  integrity_rules:
    - "Every claim has a confidence field (0.0-1.0)"
    - "Every claim has a status field (proven, confirmed, conjectured, disproven, draft, withdrawn)"
    - "Withdrawn proofs are kept in the KB with status=withdrawn (R-FINAL_RH_PROOF-2025)"
    - "Gap analyses are first-class entities (R-Gap-Analysis-2025)"
    - "ABSOLUTE_TRUST.md is flagged as overclaiming in the KB"
  references:
    - DOC-Absolute-Trust
    - R-Gap-Analysis-2025
    - R-FINAL_RH_PROOF-2025
  tags: ["stoicism", "integrity", "honesty", "acceptance"]

