- id: KB-Numerical-Verification-Pipeline
  name: "Numerical Verification Pipeline for Bridge B"
  type: experiment
  category: verification
  subcategory: numerical
  date: "2026-01-01"
  year: 2026
  status: proposed
  confidence: 0.80
  statement: |
    Before attempting a formal proof of ρ(L_{1/2+it}) < 1, verify it numerically.

    PIPELINE:
    1. Implement Mayer transfer operator L_s as a matrix on a finite-dimensional
       approximation space (e.g., Fourier modes on [0,1])
    2. Compute eigenvalues of L_{1/2+it} for |t| < 100, step 0.1
    3. Check that all eigenvalues have |λ| < 1
    4. If yes: Proceed to formal proof
    5. If no: ABORT (RH would be false)

    IMPLEMENTATION:
    - Use numpy/scipy for eigenvalue computation (existing scripts)
    - Matrix size: 100×100 to 1000×1000 (convergence check)
    - Parameter range: t ∈ [-100, 100], step 0.1
    - Verification: |λ_max| < 1 for all t

    EXISTING TOOLS:
    - scripts/compute_eigenvalues.py: Sparse Lanczos eigenvalue computation
    - scripts/train_lmfdb_ml_53k.py: sklearn ML on LMFDB data
    - data/eigenvalues/: Precomputed eigenvalue data

    This follows the "fail fast" principle: a 5-minute computation can save
    months of wasted proof effort.
  steps:
    - "Implement L_s as finite matrix (Fourier basis on [0,1])"
    - "Compute eigenvalues for t ∈ [-100, 100], step 0.1"
    - "Verify |λ_max| < 1 for all t"
    - "If passes: Proceed to formal proof"
    - "If fails: ABORT (RH false or implementation error)"
  estimated_time: "3-5 days"
  references:
    - PHIL-Numerical-First
    - EX-Spectral-Zeta-Design
    - KB-Spectral-Radius-Bound
  tags: ["numerical-verification", "fail-fast", "spectral-radius", "bridge-b"]

