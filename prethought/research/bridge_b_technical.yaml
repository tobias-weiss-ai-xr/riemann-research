- id: KB-Mathlib-Gaps
  name: "Mathlib Gaps Obstructing Formalization"
  type: problem
  category: formalization
  subcategory: mathlib
  date: "2026-01-01"
  year: 2026
  status: open
  confidence: 1.0
  statement: |
    Gaps in mathlib that obstruct the full formalization of RH via Bridge B.

    GAP 1: Hadamard Product (CRITICAL)
    - The Hadamard product for entire functions is not in mathlib
    - Needed for: Factorization of det(I - L_s) in terms of zeta zeros
    - Impact: Without Hadamard product, cannot connect spectral radius to zeta zeros
    - Solution: Contribute Hadamard product to mathlib (PR)
    - Estimated effort: 2-3 months

    GAP 2: Nuclear Operator Theory (HIGH)
    - Nuclear (trace class) operators are not fully developed in mathlib
    - Needed for: Nuclearity of L_s
    - Impact: Cannot formalize "L_s is nuclear" directly
    - Workaround: Use Hilbert-Schmidt composition (available in mathlib)
    - Estimated effort: 1-2 months

    GAP 3: Fredholm Determinant (MEDIUM)
    - Fredholm determinant theory is not in mathlib
    - Needed for: det(I - L_s) = Z(s)^{-1} × Z(s-1)
    - Impact: Cannot formalize Mayer identity directly
    - Workaround: State as axiom (temporary) and prove later
    - Estimated effort: 1-2 months

    GAP 4: Transfer Operator Theory (HIGH)
    - No transfer operator theory in mathlib
    - Needed for: Definition of L_s
    - Impact: Must build from scratch
    - Solution: Build minimal transfer operator theory in Riemann/ namespace
    - Estimated effort: 1 month

    PRIORITY: Fix FriedliRatio.lean first (1-2 days), then contribute
    Hadamard product to mathlib (highest impact, longest timeline).
  gaps:
    - name: "Hadamard Product"
      severity: "critical"
      impact: "Cannot connect spectral radius to zeta zeros"
      workaround: "None (must contribute to mathlib)"
      effort: "2-3 months"
    - name: "Nuclear Operator Theory"
      severity: "high"
      impact: "Cannot formalize nuclearity directly"
      workaround: "Use Hilbert-Schmidt composition"
      effort: "1-2 months"
    - name: "Fredholm Determinant"
