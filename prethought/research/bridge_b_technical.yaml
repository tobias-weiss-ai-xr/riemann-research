      effort: "1-2 months"
    - name: "Transfer Operator Theory"
      severity: "high"
      impact: "Must define L_s from scratch"
      workaround: "Build in Riemann/ namespace"
      effort: "1 month"
  references:
    - OP-Hadamard-Product-Gap
    - KB-Lean-Formalization-Status
  tags: ["mathlib", "gaps", "hadamard", "formalization", "obstruction"]

