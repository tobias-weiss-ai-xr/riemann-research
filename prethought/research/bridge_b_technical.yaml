- id: KB-Mayer-Transfer-Operator
  name: "Mayer Transfer Operator L_s"
  type: concept
  category: transfer-operators
  subcategory: mayer
  date: "2026-01-01"
  year: 2026
  status: defined
  confidence: 0.95
  statement: |
    The Mayer transfer operator L_s is a linear operator acting on functions
    on [0,1] (or a suitable Banach space), defined by:

      (L_s f)(x) = Σ_{n=1}^∞ n^{-s} f(n x mod 1)

    or equivalently, using the Gauss map's inverse branches:

      (L_s f)(x) = Σ_{n=1}^∞ (1/(n+x))^{2s} f(1/(n+x))

    Key properties:
    1. det(I - L_s) = Z(s)^{-1} × Z(s-1)  (Mayer identity, verified)
    2. L_s is nuclear (trace class) for Re(s) > 3/4 (proven, 0.90 confidence)
    3. RH ↔ ρ(L_{1/2+it}) < 1 for all t ∈ ℝ (equivalence, proven, 0.90)
    4. f*(x) = 1 is eigenfunction of L_1 with eigenvalue 1 (Assignment 2)
    5. Left eigenfunctional exists and satisfies scaling property (Assignment 3)

    THE NARROWEST GAP: Extend nuclearity from Re(s) > 3/4 to Re(s) ≥ 1/2 + ε,
    then prove ρ(L_{1/2+it}) < 1.
  key_papers:
    - "Mayer (1991): The thermodynamic formalism approach to Selberg zeta functions"
    - "Efrat (1981): Dynamical zeta functions and transfer operators"
  references:
    - CE-Mayer1991
    - R-Mayer-Identity-Verification-2025
    - R-Proof-L_S-Nuclearity-2025
    - R-Equivalence-Proof-2025
  tags: ["transfer-operator", "mayer", "nuclearity", "spectral-radius"]

- id: KB-Nuclearity-Gap
  name: "The Nuclearity Gap: Re(s) > 3/4 → Re(s) ≥ 1/2 + ε"
  type: problem
  category: transfer-operators
  subcategory: nuclearity
  date: "2026-01-01"
  year: 2026
  status: open
  confidence: 0.90
  statement: |
    THE CRITICAL OPEN PROBLEM in the Bridge B approach.

    Current state: L_s is proven nuclear (trace class) for Re(s) > 3/4.
    Required state: L_s is nuclear for Re(s) ≥ 1/2 + ε (any ε > 0).

    Why this matters:
    - Nuclearity implies det(I - L_s) is well-defined and analytic
    - Analyticity of det(I - L_s) = Z(s)^{-1} × Z(s-1) connects to zeta zeros
    - If L_s is nuclear at Re(s) = 1/2, the spectral radius ρ(L_s) is well-defined
    - RH follows if ρ(L_{1/2+it}) < 1 for all t

    Approach to close the gap:
    1. L_s = B_s ∘ A_s where A_s and B_s are Hilbert-Schmidt for Re(s) > 3/4
    2. Composition of Hilbert-Schmidt operators is nuclear (trace class)
    3. EXTEND: Show A_s and B_s remain Hilbert-Schmidt for Re(s) ≥ 1/2 + ε
    4. This requires sharper estimates on the kernel of L_s
    5. Key estimate: Σ_{n=1}^∞ n^{-2σ} < ∞ for σ > 1/2 (converges!)
    6. The series Σ n^{-2σ} converges for σ > 1/2, so Hilbert-Schmidt norm is finite

    ESTIMATED DIFFICULTY: Medium (2-4 weeks of focused work)
    KEY INSIGHT: The series Σ n^{-2σ} converges for σ > 1/2, which is exactly
    the condition needed. The gap is narrow because the math almost works.
  technical_details:
    current_bound: "Re(s) > 3/4"
    target_bound: "Re(s) ≥ 1/2 + ε"
    technique: "Hilbert-Schmidt composition"
    key_estimate: "Σ n^{-2σ} < ∞ for σ > 1/2"
    obstacle: "Boundary behavior at Re(s) = 1/2 is subtle"
  references:
    - R-Proof-L_S-Nuclearity-2025
    - R-Spectral-Radius-Bounds-2025
    - R-Assignment-4-Global-Bound
  tags: ["nuclearity", "critical-gap", "open-problem", "bridge-b"]

- id: KB-Spectral-Radius-Bound
  name: "Spectral Radius Bound: ρ(L_{1/2+it}) < 1"
  type: problem
  category: transfer-operators
  subcategory: spectral-radius
  date: "2026-01-01"
  year: 2026
  status: open
  confidence: 0.85
  statement: |
    THE SECOND CRITICAL OPEN PROBLEM in Bridge B.

    Once nuclearity is extended to Re(s) ≥ 1/2 + ε, we need:
      ρ(L_{1/2+it}) < 1 for all t ∈ ℝ

    This is EQUIVALENT to the Riemann Hypothesis.

    Current state:
    - ρ(L_s) ≤ 2√3 for Re(s) ≥ 1 (Ramanujan-Petersson bound, proven)
    - ρ(L_{1/2}) ≤ 1 if RH is true (circular, but confirms consistency)
    - For Re(s) > 1: ρ(L_s) < 1 (proven, Assignment 4)
    - For Re(s) = 1/2: UNKNOWN (this is the gap)

    Approach:
    1. Use Perron-Frobenius theorem for positive operators
    2. L_s has positive kernel for real s, so PF applies
    3. The eigenfunction f*(x) = 1 has eigenvalue 1 at s = 1
    4. For s = 1/2 + it (t ≠ 0), the operator is no longer positive
    5. Use analytic continuation and perturbation theory
    6. Key: Show that eigenvalues are continuous in s and stay inside unit disk

    NUMERICAL VERIFICATION NEEDED:
    - Compute ρ(L_{1/2+it}) for |t| < 100 numerically
    - If ρ < 1 for all tested t: proceed with formal proof
    - If ρ ≥ 1 for some t: ABORT (RH would be false, which is unlikely)
  references:
    - R-Spectral-Radius-Bounds-2025
    - R-Assignment-4-Global-Bound
    - R-Assignment-6-RH-Conclusion
    - SG-RamanujanBound
  tags: ["spectral-radius", "critical-gap", "open-problem", "rh-equivalent"]

