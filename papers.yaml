- id: riemann-1859
  title: "Über die Anzahl der Primzahlen unter einer gegebenen Grösse"
  authors: ["Bernhard Riemann"]
  date: 1859-11
  url: "https://arxiv.org/abs/0809.2087"  # modern reprint
  venue: "Monatsberichte der Berliner Akademie"
  category: number-theory
  subcategory: l-functions
  abstract: |
    Introduces the Riemann zeta function and formulates the Riemann Hypothesis:
    all non-trivial zeros have real part 1/2. Establishes the functional equation,
    trivial zeros at negative even integers, and the Euler product.
  doi: "10.1002/andp.185910305"
  status: foundational
  open_access: true
  notes: "The original 8-page paper. Millennium Prize Problem #1."
  tags: ["zeta-function", "riemann-hypothesis", "foundational"]

- id: mayer-1991
  title: "On zeta functions associated with Rashomon graphs"
  authors: ["Dieter H. Mayer"]
  date: 1991
  url: "https://eudml.org/doc/138777"
  venue: "Mathematische Annalen"
  category: dynam-systems
  subcategory: transfer-operator
  abstract: |
    Studies the Selberg zeta function for PSL(2,Z) via transfer operators on
    the Gauss map. Establishes the identity Z_S(s) = det(1-L_s) det(1+L_s) for Re(s)>1,
    where L_s is the weighted transfer operator.
  doi: "10.1007/BF01444974"
  status: foundational
  open_access: true
  notes: "Transfer operator L_s f(x) = Σ_{n=1}^∞ (n+x)^{-2s} f(1/(n+x)), the operator we use."
  tags: ["transfer-operator", "selberg-zeta", "gauss-map"]

