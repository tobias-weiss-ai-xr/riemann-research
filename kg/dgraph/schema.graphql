# =============================================================================
# Riemann Research Corpus — Knowledge Graph Schema (Dgraph, DQL syntax)
# =============================================================================
# Task KG-001 · kg/dgraph/schema.graphql
#
# This is a *native DQL schema*, not a GraphQL-API schema. The .graphql
# filename is kept for path compatibility with the existing loader scripts
# (kg/dgraph/load_kg.sh, kg/scripts/export_to_dgraph.py).
#
# Grammar:
#     <predicate>: <type> [@index(tokenizer, ...)] [@reverse] [@upsert] .
#     type <TypeName> { <predicate> ... }        # membership list, no types
#
# Apply it with (Dgraph must be running — see docker-compose.yml):
#     curl -X POST localhost:8080/alter --data-binary @schema.graphql
#
# Sources of truth for predicate names:
#   * kg/scripts/export_to_dgraph.py  (PREDICATE_MAP / TYPE_MAP)
#   * kg/dgraph/load_full_kb.py       (JSON mutation loader)
#   * prethought/**/*.yaml            (entity field names)
#   * kg/README.md                    (planned node + relationship model)
#
# Conventions:
#   * dgraph.type is built-in and already indexed — never redefine it.
#   * Dgraph predicates are GLOBAL; type blocks only declare membership
#     (they drive `expand(_all_)` and `dgraph.type` filtering).
#   * Relationship predicates are [uid] edges with @reverse so inverse
#     traversal works (e.g. ~references from a Concept back to its Findings).
#   * `date` is a plain string: the corpus mixes "YYYY", "YYYY-MM" and
#     "YYYY-MM-DD", which are not valid RFC 3339 datetimes.
#   * List predicates ([string]) accept either one scalar value or many,
#     which both loaders produce.
#
# Supported query surface (see DGRAPH-STATUS.md / FILES-GENERATED.md):
#     eq(dgraph.type, "Concept")            type blocks
#     eq(id, ...)                           id  @index(exact) @upsert
#     eq(status/confidence/category, ...)   ... @index(exact)
#     anyoftext(name/tags, "...")           ... @index(fulltext)
#     anyofterms(name/tags, "...")          ... @index(term)
#     regex(name, "...")                    name @index(trigram)
#     has(<predicate>)                      any declared predicate
# =============================================================================


# -----------------------------------------------------------------------------
# Identity & classification (shared by every node type)
# -----------------------------------------------------------------------------

id: string @index(exact) @upsert .
name: string @index(exact, term, fulltext, trigram) .
entity_type: string @index(exact) .
category: string @index(exact) .
subcategory: string @index(exact) .
status: string @index(exact) .
confidence: string @index(exact) .
type: string @index(exact) .
tags: [string] @index(term, fulltext) .
date: string @index(exact) .
description: string @index(term) .

# -----------------------------------------------------------------------------
# Concept  (prethought/concepts/*.yaml — Cayley graphs, spectral gaps, ...)
# -----------------------------------------------------------------------------

definition: string @index(term, fulltext) .
abstract: string @index(term, fulltext) .
properties: [string] .
lean_status: string @index(exact) .
lean_file: string .
cypher_file: string .

# -----------------------------------------------------------------------------
# Finding  (prethought/findings/*.yaml — empirical results, refutations, ...)
# -----------------------------------------------------------------------------

statement: string @index(term, fulltext) .
experiment: [string] @index(exact) .
configuration: string .
results: string .
analysis: string @index(term) .
conclusion: string @index(term) .
verdict: string @index(exact) .

# -----------------------------------------------------------------------------
# Paper & Researcher  (papers.yaml, prethought/papers/, related-work/)
# -----------------------------------------------------------------------------

title: string @index(exact, term, fulltext, trigram) .
authors: [string] @index(term) .
author: [string] @index(term) .
year: int @index .
url: string @index(exact) .
venue: string @index(term) .
doi: string @index(exact) .
relevance: string @index(exact) .
open_access: bool .
notes: string .
orcid: string @index(exact) .
affiliation: string @index(term) .
website: string .

# -----------------------------------------------------------------------------
# Approach & Problem  (prethought/open-problems/, related-work/)
# -----------------------------------------------------------------------------

strategy: string .
priority: string @index(exact) .
difficulty: string @index(exact) .

# -----------------------------------------------------------------------------
# Theorem, Experiment, Script, Dataset, Reference
# -----------------------------------------------------------------------------

proof: string .
proof_status: string @index(exact) .
paper_id: string @index(exact) .
file: string @index(exact) .
section: string .
source: string @index(exact) .
path: string .
size: string .
format: string @index(exact) .
language: string @index(exact) .
dependencies: [string] .

# -----------------------------------------------------------------------------
# Relationship edges  ([uid] with @reverse — the graph structure)
#
# Planned predicate set from kg/README.md plus the edge predicates emitted by
# kg/scripts/export_to_dgraph.py (list-of-reference YAML fields).
#   <finding>  <proven_by>   <experiment> .
#   <theorem>  <implies>     <theorem> .
#   <concept>  <~references> <finding>   .   # reverse traversal
# -----------------------------------------------------------------------------

related_concepts: [uid] @reverse .
references: [uid] @reverse .
depends_on: [uid] @reverse .
supports: [uid] @reverse .
contradicts: [uid] @reverse .
relates_to: [uid] @reverse .
implies: [uid] @reverse .
implied_by: [uid] @reverse .
proven_by: [uid] @reverse .
disproven_by: [uid] @reverse .
referenced_by: [uid] @reverse .
implies_open: [uid] @reverse .
blocks: [uid] @reverse .
blocking: [uid] @reverse .
blocked_by: [uid] @reverse .
equivalent_to: [uid] @reverse .
generalizes: [uid] @reverse .
specializes_of: [uid] @reverse .
targets: [uid] @reverse .
uses_concepts: [uid] @reverse .
uses_findings: [uid] @reverse .
findings: [uid] @reverse .
scripts: [uid] @reverse .
papers: [uid] @reverse .
used_by: [uid] @reverse .
used_in: [uid] @reverse .
authored: [uid] @reverse .
authored_by: [uid] @reverse .


